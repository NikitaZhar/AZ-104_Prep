rs (Microsoft 365, Azure, Dynamics CRM Online)."}, {"section": "Microsoft Entra ID Services", "question": "Which capabilities does Microsoft Entra ID provide? (Choose three)", "options": ["Authentication", "Single sign-on (SSO)", "Application management", "Physical datacenter cooling"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Entra ID provides authentication, single sign-on, application management, and device management."}, {"section": "Microsoft Entra ID Services", "question": "Which features are part of Entra ID authentication?", "options": ["Self-service password reset, MFA, banned passwords, smart lockout", "Domain join, group policy, LDAP, and Kerberos/NTLM", "Encryption at rest, key rotation, and certificate storage", "DDoS protection, perimeter firewalls, and port filtering"], "answer": 0, "explanation": "Entra ID authentication includes self-service password reset, multifactor authentication, banned password lists, and smart lockout."}, {"section": "Microsoft Entra Connect", "question": "What does Microsoft Entra Connect do?", "options": ["Synchronizes user identities between on-premises AD and Entra ID", "Deploys managed domain controllers into an Azure region", "Stores application secrets, keys, and certificates securely", "Detects and resolves threats across cloud and hybrid resources"], "answer": 0, "explanation": "Entra Connect synchronizes user identities between on-premises Active Directory and Microsoft Entra ID."}, {"section": "Microsoft Entra Connect", "question": "What problem does Entra Connect solve for hybrid identity?", "options": ["It avoids maintaining two separate identity sets", "It removes the need for any on-premises directory", "It blocks cloud apps from using on-premises accounts", "It converts Active Directory into a managed domain"], "answer": 0, "explanation": "Without a connection you'd maintain two separate identity sets; Entra Connect bridges that gap so users get a consistent experience."}, {"section": "Microsoft Entra Domain Services", "question": "What does Microsoft Entra Domain Services provide?", "options": ["Managed domain services without running your own domain controllers", "A bidirectional sync engine between two cloud tenants", "A passwordless sign-in option for information workers", "Threat protection for AWS and GCP workloads"], "answer": 0, "explanation": "Entra Domain Services provides managed domain services — domain join, group policy, LDAP, Kerberos/NTLM — without you deploying or maintaining domain controllers."}, {"section": "Microsoft Entra Domain Services", "question": "Why is Entra Domain Services especially useful?", "options": ["It supports legacy apps that can't use modern authentication", "It eliminates the need for any user authentication", "It replaces Microsoft Entra Connect in all scenarios", "It is required before you can enable single sign-on"], "answer": 0, "explanation": "It's especially useful for legacy applications that can't use modern authentication; you can lift and shift them into a managed domain."}, {"section": "Microsoft Entra Domain Services Synchronization", "question": "When you create a managed domain, what is deployed into your selected Azure region?", "options": ["Two Windows Server domain controllers, known as a replica set", "A single Linux-based directory server with LDAP", "A pair of Azure Key Vault instances for key storage", "A virtual network gateway for hybrid connectivity"], "answer": 0, "explanation": "Two Windows Server domain controllers are deployed into your selected region; this deployment is known as a replica set."}, {"section": "Microsoft Entra Domain Services Synchronization", "question": "How does synchronization work for a managed domain?", "options": ["One-way, from Entra ID to the managed domain", "Two-way, between the managed domain and Entra ID", "One-way, from the managed domain to Entra ID", "Two-way, but only for guest user accounts"], "answer": 0, "explanation": "A managed domain performs one-way synchronization from Entra ID to Entra Domain Services; objects created directly in the managed domain don't sync back."}, {"section": "Authentication Methods", "question": "What does authentication establish?", "options": ["The identity of a person, service, or device via credentials", "The network route a request takes to reach a service", "The encryption keys used to protect data at rest", "The cost of running a workload in a region"], "answer": 0, "explanation": "Authentication establishes the identity of a person, service, or device by requiring credentials."}, {"section": "Authentication Methods", "question": "In the security-vs-convenience comparison, how are passwords characterized?", "options": ["Low security but high convenience", "High security and high convenience", "High security but low convenience", "Low security and low convenience"], "answer": 0, "explanation": "Passwords on their own are low security but high convenience, whereas passwordless is both high security and high convenience."}, {"section": "Single Sign-On", "question": "What does single sign-on (SSO) let a user do?", "options": ["Sign in once and access multiple trusted applications", "Use a different password for each application", "Bypass authentication for internal applications", "Reset other users' passwords on their behalf"], "answer": 0, "explanation": "SSO lets a user sign in once and access multiple trusted applications, reducing password sprawl."}, {"section": "Single Sign-On", "question": "Why is SSO only as secure as its initial authenticator?", "options": ["All later connections rely on the security of that first sign-in", "Each app re-verifies the password on its own", "SSO encrypts every session with a unique key", "SSO requires MFA on every single application"], "answer": 0, "explanation": "SSO is only as secure as the initial authenticator because subsequent connections are all based on the security of that initial authenticator."}, {"section": "Multifactor Authentication", "question": "What are the three categories of MFA factors? (Choose three)", "options": ["Something the user knows", "Something the user has", "Something the user is", "Somewhere the user has been"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "MFA factors fall into three categories: something you know (password), something you have (a phone code), and something you are (a biometric)."}, {"section": "Multifactor Authentication", "question": "With MFA enabled, why isn't a stolen password enough?", "options": ["The attacker still needs the second factor to sign in", "The password is automatically changed on theft", "Entra ID blocks every sign-in from new devices", "SSO removes the password from the sign-in flow"], "answer": 0, "explanation": "With MFA, an attacker who obtains a password still needs the second factor — such as a phone prompt or biometric — to complete sign-in."}, {"section": "Passwordless Authentication", "question": "What does passwordless authentication replace the password with?", "options": ["A trusted device plus a biometric or PIN", "A longer, more complex master password", "A one-time code sent over email", "A shared secret stored in the application"], "answer": 0, "explanation": "Passwordless methods eliminate the password, replacing it with a trusted device plus a biometric signal or PIN."}, {"section": "Passwordless Options", "question": "Which passwordless options does Microsoft Entra ID support? (Choose three)", "options": ["Windows Hello for Business", "Microsoft Authenticator app", "FIDO2 security keys", "Microsoft Entra Connect sync"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Entra ID supports three passwordless options: Windows Hello for Business, the Microsoft Authenticator app, and FIDO2 security keys."}, {"section": "Passwordless Options", "question": "For whom is Windows Hello for Business ideal?", "options": ["Information workers with their own designated Windows PC", "Shared kiosk users with no assigned device", "External guest users from another tenant", "Service accounts used by automation scripts"], "answer": 0, "explanation": "Windows Hello for Business is ideal for information workers that have their own designated Windows PC, with credentials tied to that PC."}, {"section": "Passwordless Options", "question": "What characterizes FIDO2 security keys?", "options": ["Unphishable hardware devices using an open WebAuthn standard", "Software certificates installed in the browser", "One-time passwords generated by an email service", "Cloud-stored passwords synced across devices"], "answer": 0, "explanation": "FIDO2 is an open standard built on WebAuthn; FIDO2 keys are unphishable hardware devices (USB, Bluetooth, or NFC) that authenticate without a username or password."}, {"section": "External Identities", "question": "What is an external identity?", "options": ["A person, device, or service that exists outside your tenant", "A built-in administrator account inside your tenant", "A managed identity assigned to an Azure resource", "A service principal used only for automation"], "answer": 0, "explanation": "An external identity is a person, device, or service that exists outside your tenant; Entra External ID manages secure interaction with them."}, {"section": "External Identities", "question": "In external identity scenarios, who handles authentication versus authorization?", "options": ["The external provider authenticates; you authorize with Entra ID or B2C", "You authenticate the guest; the external provider authorizes", "Both authentication and authorization stay with the external provider", "Both authentication and authorization move entirely to your tenant"], "answer": 0, "explanation": "The external identity provider manages authentication, and you manage authorization to your applications with Entra ID or Azure AD B2C."}, {"section": "External ID Capabilities", "question": "Which capabilities make up Microsoft Entra External ID? (Choose three)", "options": ["B2B collaboration", "B2B direct connect", "External ID for customers (formerly Azure AD B2C)", "Entra Connect cloud sync"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "External Identities comprise B2B collaboration, B2B direct connect, and Entra External ID for customers (formerly Azure AD B2C)."}, {"section": "External ID Capabilities", "question": "How are B2B collaboration users represented in your directory?", "options": ["As guest users in your directory", "As full member accounts in your directory", "They aren't in your directory at all", "As managed identities on your resources"], "answer": 0, "explanation": "B2B collaboration users are represented in your directory, typically as guest users."}, {"section": "External ID Capabilities", "question": "What does B2B direct connect currently support, and how are its users represented?", "options": ["Teams shared channels; users aren't in your directory", "SaaS app publishing; users appear as guests", "Domain join; users appear as members", "LDAP queries; users sync to the managed domain"], "answer": 0, "explanation": "B2B direct connect supports Teams shared channels; those users aren't represented in your directory but are visible in the shared channel and Teams admin center reports."}, {"section": "Guest Access Management", "question": "How can you confirm guest users still need their access over time?", "options": ["Use an access review where guests or a decision maker recertify access", "Delete and recreate every guest account each month", "Disable all guest sign-ins until manually re-approved", "Convert guests to members to remove the need for review"], "answer": 0, "explanation": "You can use access reviews where guests themselves or a decision maker recertify (attest) access, then remove access for those who no longer need it."}, {"section": "Conditional Access", "question": "What is Conditional Access?", "options": ["A tool that allows or denies access based on identity signals", "A service that encrypts data at rest and in transit", "A managed domain feature for legacy applications", "A benchmark used to harden Azure resources"], "answer": 0, "explanation": "Conditional Access is a tool Entra ID uses to allow or deny access to resources based on identity signals such as who, where, and what device."}, {"section": "Conditional Access Flow", "question": "What is the correct order of the Conditional Access flow during sign-in?", "options": ["Collect signals, make a decision, then enforce it", "Enforce a decision, then collect signals afterward", "Make a decision, enforce it, then collect signals", "Collect signals and enforce simultaneously without a decision"], "answer": 0, "explanation": "During sign-in, Conditional Access collects signals, makes a decision based on them, and then enforces it (allow, deny, or challenge for MFA)."}, {"section": "Conditional Access Scenarios", "question": "Which are common scenarios for using Conditional Access? (Choose three)", "options": ["Require MFA based on role, location, or network", "Allow access only through approved client apps", "Require access only from managed devices", "Encrypt all stored data with customer-managed keys"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Conditional Access is useful to require MFA by role/location/network, require approved client apps, require managed devices, and block untrusted sources."}, {"section": "Conditional Access Scenarios", "question": "A company wants to grant access only from devices that meet its security and compliance standards. Which approach fits?", "options": ["Require access only from managed devices", "Require MFA for every administrator", "Block all access from outside the country", "Disable single sign-on for sensitive apps"], "answer": 0, "explanation": "Requiring users to access an application only from managed (compliant) devices is a common Conditional Access scenario."}, {"section": "Conditional Access Scenarios", "question": "How does Conditional Access make the MFA experience more granular?", "options": ["It may skip a second factor at known locations but require it for unusual sign-ins", "It always requires a second authentication factor on every single sign-in attempt", "It removes multifactor authentication once a device has been registered the first time", "It applies multifactor authentication only to external guest users from other tenants"], "answer": 0, "explanation": "A user might not be challenged for a second factor at a known location but may be challenged when sign-in signals are unusual or the location is unexpected."}, {"section": "Azure RBAC", "question": "What does Azure role-based access control (RBAC) let you do?", "options": ["Control access by assigning users or groups to roles", "Encrypt resource data with managed keys", "Synchronize identities to a managed domain", "Detect threats across multicloud resources"], "answer": 0, "explanation": "Azure RBAC lets you control access through roles; assigning users or groups to roles grants them the associated permissions."}, {"section": "Azure RBAC Roles", "question": "Which statement about Azure RBAC roles is correct?", "options": ["Azure provides built-in roles and you can define your own", "Only custom roles are allowed; no built-in roles exist", "Roles can be assigned only to individuals, not groups", "A role can be assigned to exactly one resource only"], "answer": 0, "explanation": "Azure provides built-in roles for common access patterns, and you can also define your own custom roles."}, {"section": "Azure RBAC Scopes", "question": "Which of these are valid Azure RBAC scopes? (Choose three)", "options": ["A management group", "A subscription", "A resource group", "A Conditional Access policy"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "RBAC scopes include a management group, a single subscription, a resource group, and a single resource."}, {"section": "Azure RBAC Inheritance", "question": "How does Azure RBAC inheritance work?", "options": ["Permissions at a parent scope are inherited by all child scopes", "Permissions apply only to the exact scope assigned", "Child scopes override and remove parent permissions", "Inheritance flows upward from resource to management group"], "answer": 0, "explanation": "Azure RBAC is hierarchical: granting access at a parent scope means those permissions are inherited by all child scopes."}, {"section": "Azure RBAC Enforcement", "question": "Where is Azure RBAC enforced?", "options": ["On actions that pass through Azure Resource Manager", "At the application and data level inside each app", "Directly on the physical network switches", "Within Microsoft Entra Connect during sync"], "answer": 0, "explanation": "Azure RBAC is enforced on any action initiated against an Azure resource that passes through Azure Resource Manager."}, {"section": "Azure RBAC Limitations", "question": "What does Azure RBAC NOT do?", "options": ["Enforce access at the application or data level", "Apply permissions across inherited child scopes", "Use built-in roles for common access patterns", "Work through Azure Resource Manager"], "answer": 0, "explanation": "Azure RBAC doesn't enforce access permissions at the application or data level; application security must be handled by your application."}, {"section": "Azure RBAC Allow Model", "question": "Azure RBAC uses an allow model. If one assignment grants read and another grants write on the same resource group, what do you have?", "options": ["Both read and write access on that resource group", "Only read access, because it is the safer default", "Only write access, because it was assigned more recently", "No access at all until the assignments are merged"], "answer": 0, "explanation": "With the allow model, separate assignments combine: read plus write on the same resource group gives you both read and write."}, {"section": "Zero Trust", "question": "What core assumption does the Zero Trust model start from?", "options": ["Assume breach and verify every request as if untrusted", "Assume the internal corporate network is inherently safe", "Assume managed devices never need to re-authenticate again", "Assume perimeter firewalls alone are sufficient protection"], "answer": 0, "explanation": "Zero Trust assumes breach at the outset and verifies each request as though it originated from an uncontrolled network."}, {"section": "Zero Trust Principles", "question": "What are the guiding principles of Zero Trust? (Choose three)", "options": ["Verify explicitly", "Use least privilege access", "Assume breach", "Trust the internal network"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Zero Trust is based on three principles: verify explicitly, use least privilege access (JIT/JEA), and assume breach."}, {"section": "Zero Trust Principles", "question": "What does the 'use least privilege access' principle involve?", "options": ["Limiting access with JIT/JEA and risk-based adaptive policies", "Granting broad standing access to reduce friction", "Authenticating only once per device per month", "Trusting any request from inside the firewall"], "answer": 0, "explanation": "Least privilege access limits user access with Just-In-Time and Just-Enough-Access (JIT/JEA), risk-based adaptive policies, and data protection."}, {"section": "Zero Trust in Practice", "question": "How does Zero Trust change the traditional perimeter model?", "options": ["Access is based on authentication and risk, not network location", "Access depends only on being inside the corporate network", "VPN access grants full internal trust by default", "Personal devices are always blocked from any access"], "answer": 0, "explanation": "Zero Trust grants access based on authentication and context (identity, device, risk) rather than assuming safety from network location."}, {"section": "Defense-in-Depth", "question": "What is the objective of a defense-in-depth strategy?", "options": ["Use layered mechanisms to slow an attack toward data", "Rely on a single strong perimeter firewall", "Encrypt data only while it is in transit", "Replace identity controls with network controls"], "answer": 0, "explanation": "Defense-in-depth uses a series of mechanisms to slow the advance of an attack and removes reliance on any single layer."}, {"section": "Defense-in-Depth Layers", "question": "In the defense-in-depth model, what sits at the center that all layers protect?", "options": ["Data", "The perimeter firewall", "Physical hardware", "The identity provider"], "answer": 0, "explanation": "Defense-in-depth is visualized as layers with the data to be secured at the center and all other layers protecting it."}, {"section": "Defense-in-Depth Controls", "question": "Which layer uses DDoS protection and perimeter firewalls?", "options": ["The perimeter layer", "The data layer", "The compute layer", "The identity and access layer"], "answer": 0, "explanation": "The perimeter layer uses DDoS protection to filter large-scale attacks and perimeter firewalls to identify and alert on malicious attacks."}, {"section": "Defense-in-Depth Controls", "question": "What is the focus of the identity and access layer?", "options": ["Securing identities and using SSO, MFA, and auditing", "Securing virtual machine access and endpoints", "Encrypting data at rest and in transit", "Filtering large-scale network attacks"], "answer": 0, "explanation": "The identity and access layer secures identities, grants least access, uses SSO and MFA, and audits events and changes."}, {"section": "Defense-in-Depth Controls", "question": "What is emphasized at the network layer?", "options": ["Limiting communication and denying by default", "Securing access to virtual machines", "Protecting datacenter buildings", "Eliminating vulnerabilities in code"], "answer": 0, "explanation": "The network layer limits communication between resources, denies by default, and restricts inbound/outbound access."}, {"section": "Defense-in-Depth Controls", "question": "At the application layer, where should sensitive application secrets be stored?", "options": ["In a secure store such as Azure Key Vault", "In plain text inside the application config", "On the local disk of each virtual machine", "In the perimeter firewall rule set"], "answer": 0, "explanation": "The application layer recommends storing sensitive secrets in a secure medium such as Azure Key Vault and making security a design requirement."}, {"section": "Encryption", "question": "What is the difference between encryption at rest and in transit?", "options": ["At rest protects stored data; in transit protects moving data", "At rest protects moving data; in transit protects stored data", "Both protect only data stored in databases", "Both protect only data moving between users"], "answer": 0, "explanation": "Encryption at rest protects stored data (databases, disks, storage), while encryption in transit protects data moving between services, apps, and users."}, {"section": "Azure Key Vault", "question": "What can Azure Key Vault securely store and control access to? (Choose three)", "options": ["Secrets such as connection strings and passwords", "Encryption keys", "Certificates", "Virtual machine disks"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Azure Key Vault securely stores and controls access to secrets, encryption keys, and certificates."}, {"section": "Key Management", "question": "What is a primary benefit of using Azure Key Vault for key management?", "options": ["It centralizes secret and key management out of application code", "It encrypts data only while it is in transit", "It replaces Microsoft Entra ID for authentication", "It deploys domain controllers for legacy apps"], "answer": 0, "explanation": "Key Vault centralizes secret and key management instead of storing sensitive values directly in application code or config files."}, {"section": "Key Management", "question": "Which goals does good key management support? (Choose three)", "options": ["Control who can access keys and secrets", "Rotate and update keys over time", "Audit key and secret usage", "Eliminate the need for encryption"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Key management helps you control access to keys/secrets, rotate and update keys over time, and audit key and secret usage."}, {"section": "Managed Identities and Key Vault", "question": "How do managed identities improve secret handling with Key Vault?", "options": ["Apps retrieve secrets at runtime, reducing hard-coded credentials", "Apps store secrets directly in their source code", "Secrets are emailed to administrators on demand", "Secrets are disabled so no credentials are needed"], "answer": 0, "explanation": "When apps retrieve secrets from Key Vault at runtime using managed identities, teams reduce hard-coded credentials and improve secret governance."}, {"section": "Microsoft Defender for Cloud", "question": "What is Microsoft Defender for Cloud?", "options": ["A security posture management and threat protection service", "A managed identity synchronization service", "A passwordless authentication provider", "A relational database hosting service"], "answer": 0, "explanation": "Defender for Cloud is a security posture management and threat protection service that monitors cloud, on-premises, hybrid, and multicloud resources."}, {"section": "Defender for Cloud Hybrid and Multicloud", "question": "What is required to extend Defender for Cloud protection to non-Azure machines?", "options": ["Deploy Azure Arc and enable enhanced security features", "Deploy Microsoft Entra Connect to those machines", "Move the machines into a managed domain", "Enable single sign-on on each machine"], "answer": 0, "explanation": "Azure Arc can extend Microsoft Defender plans to non-Azure machines; deploy Arc and enable Defender for Cloud's enhanced security features."}, {"section": "Defender for Cloud AWS and GCP", "question": "For connected AWS environment let current=0, score=0, checked=false, userAnswers=Array(questions.length).fill(null);
let shuffledOptions = [];
let correctSet = [];
const $=id=>document.getElementById(id);

function isMulti(q){return Array.isArray(q.answer);}

function shuffleArray(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function updateLiveScore(){
  const percent = current === 0 && score === 0 ? 0 : Math.round((score / questions.length) * 100);
  $('scoreLive').textContent = `Score: ${score} / ${questions.length} (${percent}%)`;
}

function renderQuestion(){
  const q=questions[current];
  checked=false;
  const answerArr = isMulti(q) ? q.answer : [q.answer];
  shuffledOptions = shuffleArray(q.options.map((text, originalIndex)=>({text, originalIndex})));
  correctSet = shuffledOptions.map((o,idx)=>answerArr.includes(o.originalIndex)?idx:-1).filter(x=>x>=0);

  $('counter').textContent=`Question ${current+1} of ${questions.length}`;
  updateLiveScore();
  $('progressFill').style.width=`${(current/questions.length)*100}%`;
  $('section').textContent=q.section;
  $('question').innerHTML=q.question;
  $('hint').textContent = isMulti(q) ? `Select ${q.selectCount}.` : '';
  $('feedback').classList.remove('show');
  $('status').textContent='';
  $('explanation').textContent='';
  $('nextBtn').disabled=true;
  $('checkBtn').disabled=false;
  $('options').innerHTML='';

  const inputType = isMulti(q) ? 'checkbox' : 'radio';
  shuffledOptions.forEach((option,index)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML=`<input type="${inputType}" name="answer" value="${index}"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${option.text}</span>`;
    $('options').appendChild(label);
  });

}

function enforceLimit(){
  const q=questions[current];
  if(!isMulti(q))return;
  const boxes=[...document.querySelectorAll('input[name="answer"]')];
  const checkedCount=boxes.filter(b=>b.checked).length;
  boxes.forEach(b=>{ b.disabled = (!b.checked && checkedCount>=q.selectCount); });
}

function selectedIndices(){
  return [...document.querySelectorAll('input[name="answer"]:checked')].map(b=>Number(b.value));
}

function checkAnswer(){
  if(checked)return;
  const q=questions[current];
  const sel=selectedIndices();
  const need = isMulti(q) ? q.selectCount : 1;
  if(sel.length!==need){
    $('feedback').classList.add('show');
    $('status').textContent = isMulti(q) ? `Please select ${q.selectCount} option(s).` : 'Please select an answer.';
    $('status').className='status';
    $('explanation').textContent='';
    return;
  }
  checked=true;
  const correctSorted=[...correctSet].sort((a,b)=>a-b).join(',');
  const selSorted=[...sel].sort((a,b)=>a-b).join(',');
  const ok = correctSorted===selSorted;
  if(ok)score++;

  userAnswers[current]={
    selectedText: sel.map(i=>shuffledOptions[i].text).join(' | '),
    correctText: correctSet.map(i=>shuffledOptions[i].text).join(' | '),
    ok: ok
  };

  document.querySelectorAll('.option').forEach((el,index)=>{
    el.querySelector('input').disabled=true;
    if(correctSet.includes(index))el.classList.add('correct');
    if(sel.includes(index)&&!correctSet.includes(index))el.classList.add('wrong');
  });

  $('feedback').classList.add('show');
  $('status').textContent=ok?'Correct':'Incorrect';
  $('status').className='status '+(ok?'ok':'bad');
  $('explanation').textContent=q.explanation;
  updateLiveScore();
  $('nextBtn').disabled=false;
  $('checkBtn').disabled=true;
}

function nextQuestion(){if(current<questions.length-1){current++;renderQuestion();}else showResults();}

function showResults(){
  $('progressFill').style.width='100%';
  $('quizArea').classList.add('hidden');
  $('results').classList.add('show');

  const percent=Math.round(score/questions.length*100);
  $('finalScore').textContent=`${score} / ${questions.length} (${percent}%)`;
  $('finalText').textContent=percent>=85
    ?'Excellent. You have a strong grasp of Azure identity, access, and security.'
    :percent>=70
      ?'Good work. Review the items you missed and try the quiz again.'
      :'Review the Describe Azure identity, access, and security module and retake the quiz.';

  $('review').innerHTML='';
  questions.forEach((q,i)=>{
    const ua=userAnswers[i];
    const ok=ua!==null && ua.ok;
    const correctText = isMulti(q) ? q.answer.map(a=>q.options[a]).join(' | ') : q.options[q.answer];
    const item=document.createElement('div');
    item.className='review-item';
    item.innerHTML=`<strong>${i+1}. ${q.section}</strong><br>${q.question}<br><span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ua===null?'Not answered':(ok?'Correct':'Incorrect')}</span><br>Your answer: ${ua===null?'No answer':ua.selectedText}<br>Correct answer: ${ua===null?correctText:ua.correctText}<br><em>${q.explanation}</em>`;
    $('review').appendChild(item);
  });
}

function hashStr(s){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){
    const ch=s.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function todayStrLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
async function ensureRWPermission(handle){
  const opts={mode:'readwrite'};
  if((await handle.queryPermission(opts))==='granted') return true;
  if((await handle.requestPermission(opts))==='granted') return true;
  return false;
}
function downloadFallbackExport(quizTitle, missed){
  const payload={quizTitle, date:todayStrLocal(), mistakes:missed};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safe=quizTitle.replace(/[^\w\-]+/g,'_').slice(0,60);
  a.href=url; a.download='mistakes_'+safe+'_'+todayStrLocal()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function exportMistakesToJournal(forceCreate){
  const quizTitle = document.title || 'AZ-104 Quiz';
  const missed = [];
  questions.forEach((q,i)=>{
    const ua = userAnswers[i];
    if(!ua || !ua.ok){
      missed.push({section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount||null, explanation:q.explanation});
    }
  });
  if(missed.length===0){ alert('Ошибок нет — нечего экспортировать.'); return; }
  if(!('showOpenFilePicker' in window)){
    alert('Браузер не поддерживает прямую запись в файл (нужен Chrome/Edge). Скачиваю отдельный файл — импортируйте его вручную в Журнал ошибок.');
    downloadFallbackExport(quizTitle, missed);
    return;
  }
  let handle;
  try{
    if(forceCreate){
      handle = await window.showSaveFilePicker({suggestedName:'az104-mistakes-journal.json', types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    } else {
      [handle] = await window.showOpenFilePicker({types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    }
  }catch(e){ if(e.name!=='AbortError') console.error(e); return; }

  let journal;
  try{
    const perm = await ensureRWPermission(handle);
    if(!perm){ alert('Нет разрешения на запись в файл.'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    journal = text.trim() ? JSON.parse(text) : {mistakes:[]};
    if(!journal.mistakes || !Array.isArray(journal.mistakes)) journal.mistakes=[];
  }catch(e){ alert('Не удалось прочитать файл журнала: '+e.message); return; }

  let added=0, reset=0;
  missed.forEach(q=>{
    const id = hashStr(quizTitle+'|'+q.section+'|'+q.question);
    const existing = journal.mistakes.find(m=>m.id===id);
    if(existing){ existing.box=1; existing.masteredStreak=0; existing.nextReview=todayStrLocal(); reset++; }
    else{
      journal.mistakes.push({id, quizTitle, domain:null, section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount, explanation:q.explanation, box:1, masteredStreak:0, nextReview:todayStrLocal(), firstMissed:todayStrLocal()});
      added++;
    }
  });
  try{
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(journal,null,2));
    await writable.close();
  }catch(e){ alert('Не удалось сохранить журнал: '+e.message); return; }
  alert(`Готово. Новых вопросов: ${added}, повторно ошиблись: ${reset}.`);
}

function restart(){current=0;score=0;checked=false;userAnswers=Array(questions.length).fill(null);$('results').classList.remove('show');$('quizArea').classList.remove('hidden');renderQuestion();}
$('options').addEventListener('change',enforceLimit);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);$('restartBtn').addEventListener('click',restart);$('restartBtn2').addEventListener('click',restart);$('exportMistakesBtn').addEventListener('click',()=>exportMistakesToJournal(false));$('createJournalBtn').addEventListener('click',()=>exportMistakesToJournal(true));renderQuestion();
</script></body></html>
