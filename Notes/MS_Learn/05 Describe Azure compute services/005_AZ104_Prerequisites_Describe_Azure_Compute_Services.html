<script>
const questions = [{"section": "Azure Virtual Machines", "question": "How does the material classify Azure Virtual Machines in cloud service terms, and what does that imply for the customer?", "options": ["As IaaS, where you control the OS and installed software but still manage patching, updates, and in-VM configuration.", "As PaaS, where Azure fully manages the operating system and patching while you only deploy your application code.", "As SaaS, where the finished application is delivered ready to use and you make no infrastructure or sizing choices.", "As a serverless option, where there is no operating system to manage and you are billed only per individual execution."], "answer": 0, "explanation": "VMs are IaaS: you control the operating system and software like a physical server, but you remain responsible for patching, updates, and configuration inside the VM."}, {"section": "Azure Virtual Machines", "question": "A team needs full control of the operating system, the ability to run custom software, and custom hosting configurations. Which Azure compute option does the material point to?", "options": ["Azure Virtual Machines.", "Azure Functions.", "Azure App Service.", "Azure Container Instances."], "answer": 0, "explanation": "The material lists total OS control, running custom software, and custom hosting configurations as the cases where VMs are a good fit."}, {"section": "Azure Virtual Machines", "question": "What is an Azure VM image, as described in the material?", "options": ["A template that already includes an operating system and tools such as web hosting components.", "A point-in-time billing snapshot that records the VM's accumulated monthly compute cost.", "A network security rule set that filters the inbound and outbound traffic reaching the VM.", "A zone-redundant managed disk that the platform automatically replicates across availability zones."], "answer": 0, "explanation": "An image is a template that already includes an operating system and tools (for example, web hosting components), letting you deploy VMs quickly."}, {"section": "Azure Virtual Machines", "question": "Which scenarios does the material list as common use cases for Azure VMs? (Choose Three)", "options": ["Testing and development with quickly created OS and app configurations.", "Datacenter extension into Azure over a connected virtual network.", "Disaster recovery with failover capacity running critical workloads.", "Event-driven execution billed only for CPU time per run.", "Fully managed web hosting with no operating system to maintain."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Listed VM use cases include testing/development, cloud app hosting, datacenter extension, disaster recovery, and lift-and-shift. Per-run billing describes Functions; no-OS managed hosting describes App Service."}, {"section": "Azure Virtual Machines", "question": "A company wants to move existing server workloads to Azure with minimal application redesign. Which VM use case from the material fits?", "options": ["Lift and shift migration.", "Disaster recovery failover.", "Datacenter extension.", "Testing and development."], "answer": 0, "explanation": "Lift and shift migration moves existing server workloads with minimal application redesign."}, {"section": "VM Resources and Sizing", "question": "When provisioning a VM, which groups of resources does the material say you choose?", "options": ["Size, storage disks, and networking.", "Region pair, management group, and subscription.", "Resource group, policy, and lock.", "Trigger, runtime, and output binding."], "answer": 0, "explanation": "At provisioning you choose Size (purpose, cores, RAM), storage disks, and networking (virtual network, public IP, ports)."}, {"section": "VM Size Families", "question": "Why does Azure group VM sizes into families?", "options": ["So you can quickly choose a size based on the behavior of your workload.", "So that every family is guaranteed available in every Azure region.", "So that billing is consolidated into a single invoice per family.", "So that each family automatically replicates VMs across zones."], "answer": 0, "explanation": "VM sizes are grouped into families so you can quickly pick a size that matches your workload needs."}, {"section": "VM Size Families", "question": "A workload runs in-memory databases and analytics that need a large memory-to-core ratio. Which VM family does the material associate with that focus?", "options": ["E-series (memory optimized).", "F-series (compute optimized).", "B-series (burstable).", "N-series (GPU enabled)."], "answer": 0, "explanation": "E-series is memory optimized, with example uses including in-memory databases and analytics workloads."}, {"section": "VM Size Families", "question": "A CPU-intensive application tier needs strong per-core compute rather than large memory. Which family fits, per the material?", "options": ["F-series (compute optimized).", "M-series (large memory footprint).", "L-series (storage optimized).", "D-series (general purpose)."], "answer": 0, "explanation": "F-series is compute optimized, with CPU-intensive application tiers as the example use."}, {"section": "VM Size Families", "question": "Which family pairing matches the focus the material gives each one?", "options": ["B-series is burstable and cost-efficient, while N-series is GPU enabled for AI and graphics workloads.", "B-series is GPU enabled for graphics, while N-series is burstable and cost-efficient for dev/test.", "B-series is storage optimized for throughput, while N-series is memory optimized for in-memory data.", "B-series is large memory for big databases, while N-series is general purpose for web servers."], "answer": 0, "explanation": "B-series is burstable and cost-efficient (dev/test with occasional spikes); N-series is GPU enabled for AI training/inference and graphics."}, {"section": "VM Size Families", "question": "Which adjustable VM options does the material list as customizable per size? (Choose Three)", "options": ["vCPU count, affecting compute capacity for CPU-bound workloads.", "RAM, affecting how much working data the VM keeps in memory.", "Premium SSD support, indicating whether the size supports premium managed disks.", "Region pairing, indicating which secondary region the VM fails over to.", "Management group depth, indicating how many policy levels apply."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Listed adjustments include vCPU count, RAM, disk configuration, network throughput, premium SSD support, and hardware generation. Region pairing and management-group depth are unrelated governance/resiliency concepts."}, {"section": "VM Size Families", "question": "In the size name <code>Standard_D2s_v5</code>, what does each part indicate according to the material?", "options": ["D is the family, 2 is the vCPU count, s indicates Premium SSD support, and v5 is the hardware generation.", "D is the datacenter, 2 is the number of zones, s indicates storage tier, and v5 is the version of the OS.", "D is the disk type, 2 is the RAM in GB, s indicates a spot instance, and v5 is the vCPU count.", "D is the deployment ring, 2 is the fault domain, s indicates a sovereign region, and v5 is the price tier."], "answer": 0, "explanation": "D = family (general purpose), 2 = vCPUs, s = Premium SSD support, v5 = hardware generation."}, {"section": "Scale Sets", "question": "What do Azure virtual machine scale sets let you create and manage?", "options": ["Groups of identical, load-balanced VMs that can automatically scale out or in.", "A single VM whose OS disk is replicated to a paired region.", "A set of containers orchestrated across a Kubernetes cluster.", "A serverless function that runs only when an event triggers it."], "answer": 0, "explanation": "Scale sets create and manage groups of identical, load-balanced VMs, centralizing configuration and scaling out or in on demand or schedule."}, {"section": "Scale Sets", "question": "Without scale sets, what does the material say you must do manually that scale sets handle for you?", "options": ["Keep VM configuration consistent, monitor utilization, and adjust instance counts.", "Write the application code that responds to each incoming event.", "Define update and fault domains for in-region resiliency.", "Manage the container lifecycle across a fleet."], "answer": 0, "explanation": "Without scale sets you must manually keep configuration consistent, monitor utilization, and adjust instance counts; scale sets centralize and automate this."}, {"section": "Availability Sets", "question": "What is the purpose of virtual machine availability sets?", "options": ["To improve VM resiliency inside a region by reducing the chance one maintenance event or hardware failure affects all VMs.", "To automatically replicate the VMs to a paired region hundreds of miles away for disaster recovery.", "To convert a group of running VMs into a serverless, event-driven compute service billed per execution.", "To orchestrate the full lifecycle of a fleet of containers running across a managed cluster."], "answer": 0, "explanation": "Availability sets improve in-region resiliency, reducing the chance that a single maintenance event or hardware failure affects all the VMs."}, {"section": "Availability Sets", "question": "Availability sets group VMs by two concepts described in the material. Which pairing is correct? (Choose Two)", "options": ["Update domain — VMs that can be rebooted together during planned maintenance.", "Fault domain — VMs that share a potential power or network failure point.", "Region pair — VMs replicated to a region 300 miles away.", "Scale domain — VMs that are automatically added during demand spikes.", "Tenant domain — VMs that inherit policy from the root group."], "answer": [0, 1], "selectCount": 2, "explanation": "Availability sets group VMs by update domain (rebooted together during planned maintenance) and fault domain (shared power/network failure point)."}, {"section": "Availability Sets", "question": "What does the material say about the cost of availability sets and how they compare to zone-based designs?", "options": ["Availability sets add no cost of their own (you pay for the VM instances), and where zones are supported, zone-based designs are often preferred for broader isolation.", "Availability sets carry a fixed recurring monthly platform fee on top of the VM instances, and zone-based designs are never preferred over them in any region.", "Availability sets replicate workload data across separate geographies on their own, and this fully replaces the need to ever use availability zones for resiliency.", "Availability sets are billed per individual request that they handle, in exactly the same per-use consumption way that a fully serverless compute service is normally billed."], "answer": 0, "explanation": "Availability sets themselves don't add cost (you pay for the VM instances); where Availability Zones are supported, zone-based designs are often preferred for broader failure isolation."}, {"section": "Azure Virtual Desktop", "question": "What is Azure Virtual Desktop, at a fundamentals level?", "options": ["A desktop and application virtualization service that lets users securely access Windows desktops and apps from many devices and locations.", "A container orchestration service that manages the lifecycle of a large fleet of containers across a cluster.", "An event-driven serverless platform that runs your application code only in response to incoming triggers and events.", "A best-practice recommendation engine that continuously suggests improvements for reliability, security, performance, and cost efficiency."], "answer": 0, "explanation": "Azure Virtual Desktop is a desktop and application virtualization service where desktops and apps stay in the cloud and users access them securely from many device types."}, {"section": "Azure Virtual Desktop", "question": "A support organization needs standardized cloud-hosted desktops so each shift has the same tools, access policies, and security controls. Why does the material favor Azure Virtual Desktop here?", "options": ["It centralizes desktop and app access for distributed users and is often easier to operate than building separate VM-based desktops per group.", "It removes the need for any identity or access controls on the centrally hosted cloud desktops and apps.", "It runs the desktops entirely on each user's own local device so they can be used fully offline.", "It is billed only per individual code execution, in the same pay-per-run model as an Azure function."], "answer": 0, "explanation": "AVD centralizes desktop and app access across distributed users and is often easier to operate than building separate VM-based desktop environments per user group."}, {"section": "Azure Virtual Desktop", "question": "Which key points does the material list for Azure Virtual Desktop? (Choose Three)", "options": ["It integrates with Microsoft Entra ID for identity and access controls.", "It helps reduce data exposure on local devices by keeping apps and data in Azure-hosted sessions.", "It supports both single-session and multi-session Windows desktop experiences depending on need.", "It automatically rewrites the application code to run as a serverless function.", "It replicates each hosted desktop session to a paired region by default."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "AVD's key points: integration with Microsoft Entra ID, reduced local data exposure via Azure-hosted sessions, and support for single-session and multi-session Windows."}, {"section": "Azure Containers", "question": "How does the material distinguish containers from virtual machines?", "options": ["Containers are lightweight and you don't manage the OS for them, whereas each VM runs its own OS that you manage.", "Containers each run their own full operating system that you manage, whereas all the VMs share a single OS.", "Containers can only run a single instance per host machine, whereas VMs can run many instances per host.", "Containers are an infrastructure-as-a-service offering, whereas virtual machines are a serverless compute option."], "answer": 0, "explanation": "Unlike VMs, you don't manage the operating system for a container; containers are lightweight and built to be created, scaled out, and stopped dynamically."}, {"section": "Azure Containers", "question": "Which container engine does the material name as one of the most popular, with Azure support?", "options": ["Docker.", "Kubernetes.", "Terraform.", "Ansible."], "answer": 0, "explanation": "Docker is named as one of the most popular container engines, and Azure supports Docker. (Kubernetes is orchestration, not the engine here.)"}, {"section": "Azure Containers", "question": "A team wants the fastest, simplest way to run a container in Azure without managing any virtual machines or adopting extra services. Which option fits?", "options": ["Azure Container Instances.", "Azure Kubernetes Service.", "Azure Virtual Machines.", "Azure App Service WebJobs."], "answer": 0, "explanation": "Azure Container Instances (ACI) offer the fastest, simplest way to run a container in Azure as a PaaS offering, with no VM management."}, {"section": "Azure Containers", "question": "Which capability does the material highlight as included in Azure Container Apps beyond simply running a container?", "options": ["Built-in load balancing and scaling so the design adapts to changing demand.", "Full control of the underlying operating system, its updates, and patching responsibilities.", "Orchestrating the complete lifecycle of a large fleet of containers across a cluster.", "Per-event billing with automatic resource deallocation whenever the workload becomes idle."], "answer": 0, "explanation": "Container Apps are PaaS and include built-in load balancing and scaling, so the design can adapt to changing demand."}, {"section": "Azure Containers", "question": "What is Azure Kubernetes Service (AKS) described as?", "options": ["A container orchestration service that manages the lifecycle of containers, simplifying fleet management.", "A serverless function host that runs your application code in response to incoming triggers.", "A desktop virtualization service that delivers remote Windows desktop sessions to distributed users.", "A prebuilt artificial-intelligence service whose capabilities are exposed through ready-to-use APIs."], "answer": 0, "explanation": "AKS is a container orchestration service; orchestration manages the container lifecycle and makes deploying a fleet simpler and more efficient."}, {"section": "Azure Containers", "question": "In the microservice example, a website's back end reaches capacity while the front end and storage are fine. What does the material say containers let you do?", "options": ["Scale the back end separately, and change storage or modify the front end without affecting the other components.", "Scale every component of the site together at once, because they all share a single operating system.", "Replicate all of the site's components to a paired region in the same geography automatically.", "Run all of the site's components inside one single container to keep the design simple."], "answer": 0, "explanation": "Splitting into containers lets you scale the back end independently and change or modify one component without affecting the others."}, {"section": "Azure Functions", "question": "How does the material describe Azure Functions?", "options": ["An event-driven, serverless compute option that doesn't require maintaining virtual machines or containers.", "An IaaS option where you fully manage the operating system, its updates, and all patching yourself.", "A container orchestration service for managing the lifecycle of large container fleets.", "A desktop virtualization service that delivers remote cloud desktops to distributed workers."], "answer": 0, "explanation": "Azure Functions is an event-driven, serverless compute option; an event wakes the function, removing the need to keep resources provisioned when idle."}, {"section": "Azure Functions", "question": "How does billing work for Azure Functions, per the material?", "options": ["Azure charges only for the CPU time used while the function runs, deallocating resources when it finishes.", "Azure charges a flat monthly platform fee regardless of how often, or how rarely, the function actually runs.", "Azure charges for each provisioned virtual machine that is kept running continuously to host the function.", "Azure charges per gigabyte of application data stored on the function's attached managed disk."], "answer": 0, "explanation": "Functions run when triggered and automatically deallocate when finished; you're charged only for the CPU time used while the function runs."}, {"section": "Azure Functions", "question": "What is the difference between stateless and stateful Functions described in the material?", "options": ["Stateless functions behave as if they restart each time; stateful (Durable) functions pass a context to track prior activity.", "Stateless functions store their data on managed disks, while stateful functions can run only on dedicated VMs.", "Stateless functions require containers to run, while stateful functions require a full Kubernetes cluster.", "Stateless functions are billed per individual request, while stateful functions are always provided free of charge."], "answer": 0, "explanation": "Stateless functions (the default) act as if they restart on each event; stateful functions (Durable Functions) pass a context through to track prior activity."}, {"section": "Azure Functions", "question": "A workload performs short tasks in response to events or messages, with demand that varies a lot. Why does the material consider Functions a good fit?", "options": ["They scale automatically based on demand and suit work that completes quickly in response to an event.", "They give you full control over the operating system so you can run long-running, heavily customized server software.", "They keep all compute resources provisioned and running at all times specifically to guarantee consistently low latency.", "They are designed primarily for hosting full multi-session Windows desktops for many remote users."], "answer": 0, "explanation": "Functions scale automatically with demand and are commonly used for work triggered by an event, timer, or message that completes quickly."}, {"section": "AI, ML, and IoT Services", "question": "When does the material recommend Azure AI services versus Azure Machine Learning?", "options": ["Use Azure AI services for prebuilt AI features through APIs; use Azure Machine Learning when you need to build, train, and manage custom models.", "Use Azure AI services to train your own custom models, and use Azure Machine Learning only to call prebuilt APIs.", "Use either of the two services interchangeably, since both of them only ever expose the very same set of prebuilt models.", "Use Azure AI services to ingest and process IoT device telemetry, and then use Azure Machine Learning to run remote desktop virtualization."], "answer": 0, "explanation": "Azure AI services provide prebuilt capabilities through APIs; Azure Machine Learning is for building, training, and managing custom models."}, {"section": "AI, ML, and IoT Services", "question": "How does the material say you should treat agentic AI patterns at a fundamentals level?", "options": ["As an application pattern built from Azure AI capabilities, not as a separate compute service category.", "As a dedicated serverless compute service that is entirely distinct from the Azure AI services category.", "As a built-in container orchestration feature that lives inside Azure Kubernetes Service.", "As a specialized virtual machine size family that is specifically optimized for AI model training."], "answer": 0, "explanation": "Agentic applications combine an AI model with instructions, context, and tool use; treat agentic AI as an application pattern built from Azure AI capabilities, not a separate service category."}, {"section": "AI, ML, and IoT Services", "question": "Which description matches Azure OpenAI Service as given in the material?", "options": ["An AI option supporting generative AI scenarios such as chat and content generation, with built-in security and governance controls.", "A service for connecting, monitoring, and managing a large fleet of IoT devices and the telemetry that they continuously produce.", "A service for orchestrating the complete lifecycle of containers as they run across a managed compute cluster.", "A service for building, training, and managing the full development lifecycle of custom machine learning models in the cloud."], "answer": 0, "explanation": "Azure OpenAI Service supports generative AI scenarios (chat, content generation) with built-in security and governance controls."}, {"section": "AI, ML, and IoT Services", "question": "Which Azure IoT services and roles does the material list? (Choose Three)", "options": ["Azure IoT Hub — secure, bi-directional communication between cloud and devices.", "Azure IoT Central — a simplified SaaS IoT platform for solution builders.", "Azure IoT Edge — extends cloud capabilities to edge devices closer to the data.", "Azure IoT Functions — an event-driven serverless host that runs device code on incoming triggers.", "Azure IoT Kubernetes — a dedicated orchestration layer for managing IoT-specific containers at the edge."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "The listed IoT services are IoT Hub (secure bi-directional messaging), IoT Central (SaaS platform), and IoT Edge (extends cloud to edge devices). The other two are not in the material."}, {"section": "AI, ML, and IoT Services", "question": "A solution centers on connected devices sending telemetry. Which option does the material's decision pattern point to?", "options": ["Azure IoT services.", "Azure AI services for prebuilt APIs.", "Azure Machine Learning for custom models.", "Azure App Service for web hosting."], "answer": 0, "explanation": "The decision pattern: use Azure IoT services when the solution centers on connected devices and telemetry."}, {"section": "Application Hosting Options", "question": "How does the material contrast VMs and containers as hosting options?", "options": ["VMs give maximum control of the hosting environment and may be most familiar; containers isolate and individually manage parts of the solution.", "VMs are a serverless option billed per request, while containers always require you to fully manage the operating system.", "VMs are able to host only static websites, while containers are the option able to host any kind of workload.", "VMs and containers are essentially identical hosting options that differ from each other only in their hourly price."], "answer": 0, "explanation": "VMs give maximum control and familiarity; containers isolate and individually manage aspects of the hosting solution. Both are presented as strong hosting options."}, {"section": "Azure App Service", "question": "What is Azure App Service, as described in the material?", "options": ["An HTTP-based service for hosting web apps, REST APIs, and mobile back ends without managing infrastructure, with automatic scaling and high availability.", "An IaaS service where you are responsible for managing the operating system, its updates, and all patching yourself.", "A container orchestration service that is responsible for managing the full lifecycle of a large fleet of running containers.", "An event-driven serverless compute option that is billed to you only for each individual code execution that occurs."], "answer": 0, "explanation": "App Service is an HTTP-based platform for web apps, REST APIs, and mobile back ends; it offers automatic scaling and high availability without you managing infrastructure."}, {" d tasks."}, {"section": "Azure App Service", "question": "Which capabilities does the material list for the App Service Mobile Apps feature? (Choose Three)", "options": ["Store mobile app data in a cloud-based SQL database.", "Authenticate customers against social providers such as Google and Facebook.", "Send push notifications.", "Orchestrate a fleet of containers across nodes.", "Run code only in response to IoT device telemetry."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Mobile Apps can store data in a cloud SQL database, authenticate against social providers (MSA, Google, X, Facebook), send push notifications, and run custom back-end logic in C# or Node.js."}, {"section": "Azure App Service", "question": "Which benefit does the material attribute to App Service for handling high traffic and availability?", "options": ["Built-in load balancing and traffic manager provide high availability, and sites can scale quickly to handle high loads.", "Each individual app must be manually copied onto additional servers by hand in order to handle extra traffic.", "Incoming traffic is handled only by pinning each individual app instance to a single fault domain in the region.", "High availability can be achieved only by redeploying the application as a stateful Durable Function."], "answer": 0, "explanation": "App Service includes built-in load balancing and traffic manager for high availability, and sites can be scaled quickly to handle high traffic loads."}, {"section": "Compute Option Selection", "question": "A team only cares about the code running their service, not the underlying platform, and the work runs briefly in response to events. Which compute option fits best?", "options": ["Azure Functions.", "Azure Virtual Machines.", "Azure Virtual Desktop.", "Azure Kubernetes Service."], "answer": 0, "explanation": "Functions suit cases where you care only about the code, not the platform, and the work completes quickly in response to an event."}, {"section" let current=0, score=0, checked=false, userAnswers=Array(questions.length).fill(null);
let shuffledOptions = [];
let correctSet = [];
const $=id=>document.getElementById(id);

function isMulti(q){return Array.isArray(q.answer);}

function shuffleArray(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function updateLiveScore(){
  const percent = current === 0 && score === 0 ? 0 : Math.round((score / questions.length) * 100);
  $('scoreLive').textContent = `Score: ${score} / ${questions.length} (${percent}%)`;
}

function renderQuestion(){
  const q=questions[current];
  checked=false;
  const answerArr = isMulti(q) ? q.answer : [q.answer];
  shuffledOptions = shuffleArray(q.options.map((text, originalIndex)=>({text, originalIndex})));
  correctSet = shuffledOptions.map((o,idx)=>answerArr.includes(o.originalIndex)?idx:-1).filter(x=>x>=0);

  $('counter').textContent=`Question ${current+1} of ${questions.length}`;
  updateLiveScore();
  $('progressFill').style.width=`${(current/questions.length)*100}%`;
  $('section').textContent=q.section;
  $('question').innerHTML=q.question;
  $('hint').textContent = isMulti(q) ? `Select ${q.selectCount}.` : '';
  $('feedback').classList.remove('show');
  $('status').textContent='';
  $('explanation').textContent='';
  $('nextBtn').disabled=true;
  $('checkBtn').disabled=false;
  $('options').innerHTML='';

  const inputType = isMulti(q) ? 'checkbox' : 'radio';
  shuffledOptions.forEach((option,index)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML=`<input type="${inputType}" name="answer" value="${index}"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${option.text}</span>`;
    $('options').appendChild(label);
  });

}

function enforceLimit(){
  const q=questions[current];
  if(!isMulti(q))return;
  const boxes=[...document.querySelectorAll('input[name="answer"]')];
  const checkedCount=boxes.filter(b=>b.checked).length;
  boxes.forEach(b=>{ b.disabled = (!b.checked && checkedCount>=q.selectCount); });
}

function selectedIndices(){
  return [...document.querySelectorAll('input[name="answer"]:checked')].map(b=>Number(b.value));
}

function checkAnswer(){
  if(checked)return;
  const q=questions[current];
  const sel=selectedIndices();
  const need = isMulti(q) ? q.selectCount : 1;
  if(sel.length!==need){
    $('feedback').classList.add('show');
    $('status').textContent = isMulti(q) ? `Please select ${q.selectCount} option(s).` : 'Please select an answer.';
    $('status').className='status';
    $('explanation').textContent='';
    return;
  }
  checked=true;
  const correctSorted=[...correctSet].sort((a,b)=>a-b).join(',');
  const selSorted=[...sel].sort((a,b)=>a-b).join(',');
  const ok = correctSorted===selSorted;
  if(ok)score++;

  userAnswers[current]={
    selectedText: sel.map(i=>shuffledOptions[i].text).join(' | '),
    correctText: correctSet.map(i=>shuffledOptions[i].text).join(' | '),
    ok: ok
  };

  document.querySelectorAll('.option').forEach((el,index)=>{
    el.querySelector('input').disabled=true;
    if(correctSet.includes(index))el.classList.add('correct');
    if(sel.includes(index)&&!correctSet.includes(index))el.classList.add('wrong');
  });

  $('feedback').classList.add('show');
  $('status').textContent=ok?'Correct':'Incorrect';
  $('status').className='status '+(ok?'ok':'bad');
  $('explanation').textContent=q.explanation;
  updateLiveScore();
  $('nextBtn').disabled=false;
  $('checkBtn').disabled=true;
}

function nextQuestion(){if(current<questions.length-1){current++;renderQuestion();}else showResults();}

function showResults(){
  $('progressFill').style.width='100%';
  $('quizArea').classList.add('hidden');
  $('results').classList.add('show');

  const percent=Math.round(score/questions.length*100);
  $('finalScore').textContent=`${score} / ${questions.length} (${percent}%)`;
  $('finalText').textContent=percent>=85
    ?'Excellent result. You have a strong grasp of Azure compute services.'
    :percent>=70
      ?'Good result, but review your mistakes — especially the differences between VMs, scale sets, availability sets, containers, Azure Functions, and App Service.'
      :'Revisit the section "Describe Azure compute services" and retake the quiz.';

  $('review').innerHTML='';
  questions.forEach((q,i)=>{
    const ua=userAnswers[i];
    const ok=ua!==null && ua.ok;
    const correctText = isMulti(q) ? q.answer.map(a=>q.options[a]).join(' | ') : q.options[q.answer];
    const item=document.createElement('div');
    item.className='review-item';
    item.innerHTML=`<strong>${i+1}. ${q.section}</strong><br>${q.question}<br><span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ua===null?'Not answered':(ok?'Correct':'Incorrect')}</span><br>Your answer: ${ua===null?'No answer':ua.selectedText}<br>Correct answer: ${ua===null?correctText:ua.correctText}<br><em>${q.explanation}</em>`;
    $('review').appendChild(item);
  });
}

function restart(){current=0;score=0;checked=false;userAnswers=Array(questions.length).fill(null);$('results').classList.remove('show');$('quizArea').classList.remove('hidden');renderQuestion();}
$('options').addEventListener('change',enforceLimit);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);$('restartBtn').addEventListener('click',restart);$('restartBtn2').addEventListener('click',restart);renderQuestion();
</script></body></html>
