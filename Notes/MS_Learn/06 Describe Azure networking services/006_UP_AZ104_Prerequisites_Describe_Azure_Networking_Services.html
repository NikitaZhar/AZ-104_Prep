<script>
const questions = [{"section": "Azure Virtual Network", "question": "A team needs Azure VMs, web apps, and databases to communicate with each other, internet users, and on-premises client computers. Which Azure networking capability provides this logical network foundation?", "options": ["Azure Virtual Network with virtual subnets.", "Azure DNS alias record sets only.", "An ExpressRoute circuit without a virtual network.", "A public load balancer without private address space."], "answer": 0, "explanation": "Azure Virtual Network and virtual subnets enable Azure resources such as VMs, web apps, and databases to communicate with each other, with users on the internet, and with on-premises computers."}, {"section": "Azure Virtual Network", "question": "Which description best matches an Azure virtual network in the fundamentals material?", "options": ["A logical extension of an on-premises network that links Azure resources together.", "A DNS-only service that hosts public domain records and holds no subnets.", "A dedicated private circuit from a connectivity provider to Microsoft services.", "A hardened VM that performs WAN optimization in place of subnets."], "answer": 0, "explanation": "The material describes an Azure virtual network as similar to an extension of the on-premises network, with resources that link other Azure resources."}, {"section": "Azure Virtual Network", "question": "A solution must expose a resource so it can be accessed from anywhere in the world. Which endpoint type matches this requirement?", "options": ["A public endpoint with a public IP address.", "A private endpoint using an address from the virtual network space.", "A route table entry that carries no IP address.", "A private DNS zone that has no network connectivity."], "answer": 0, "explanation": "Public endpoints have a public IP address and can be accessed from anywhere in the world."}, {"section": "Azure Virtual Network", "question": "A database must be reachable only through an address inside the virtual network address space. Which endpoint type should be used?", "options": ["A private endpoint.", "A public endpoint.", "An ExpressRoute peering location.", "A Basic public IP address."], "answer": 0, "explanation": "Private endpoints exist within a virtual network and have a private IP address from the address space of that virtual network."}, {"section": "Isolation and Segmentation", "question": "An administrator wants to create multiple isolated networks in Azure and divide each network into smaller named address ranges. Which Azure Virtual Network capability is being used?", "options": ["Defining virtual networks and allocating address space to subnets.", "Creating alias record sets for public DNS names.", "Using ExpressRoute Global Reach between on-premises sites.", "Deploying a VPN gateway only in active/standby mode."], "answer": 0, "explanation": "Azure Virtual Network lets you create multiple isolated virtual networks, define a private IP address space, and divide that address space into named subnets."}, {"section": "Isolation and Segmentation", "question": "What is true about the IP range defined for an Azure virtual network?", "options": ["The range exists only inside the virtual network and is not internet routable.", "The range is published as a public DNS domain for external lookups.", "The range is drawn from a public, internet-routable address block.", "The range is reused across other subscriptions in the tenant."], "answer": 0, "explanation": "The material states that the IP range defined for a virtual network exists only within that virtual network and is not internet routable."}, {"section": "Name Resolution", "question": "A team needs name resolution for resources in a virtual network. Which option is supported by Azure virtual networking?", "options": ["Use Azure's built-in name resolution or an internal or external DNS server.", "Use ExpressRoute Global Reach as the name resolution mechanism.", "Use public IP addresses, since DNS is unavailable for virtual networks.", "Use network security groups in the role of DNS resolvers."], "answer": 0, "explanation": "For name resolution, Azure provides a built-in name resolution service, and the virtual network can also be configured to use an internal or external DNS server."}, {"section": "Internet Communications", "question": "A VM must accept incoming connections from the internet. Which approach matches the material?", "options": ["Assign a public IP address or place the resource behind a public load balancer.", "Use a private endpoint that exposes no public access path.", "Create a private DNS domain in place of a public IP address.", "Use a user-defined route with no internet-facing resource present."], "answer": 0, "explanation": "Incoming internet connections can be enabled by assigning a public IP address to an Azure resource or putting the resource behind a public load balancer."}, {"section": "Communication Between Azure Resources", "question": "Which statement correctly describes secure communication between Azure resources through virtual networking?", "options": ["Virtual networks can connect VMs and other Azure resources such as AKS and scale sets.", "Virtual networks connect standalone VMs and work with no other Azure services.", "Virtual networks serve DNS hosting and carry no application traffic of their own.", "Virtual networks depend on ExpressRoute for communication between Azure resources."], "answer": 0, "explanation": "The material states that virtual networks can connect not only VMs but also other Azure resources, including App Service Environment, Azure Kubernetes Service, and virtual machine scale sets."}, {"section": "Service Endpoints", "question": "A team wants Azure SQL databases and storage accounts to be linked to a virtual network for improved security and optimal routing. Which feature is described?", "options": ["Service endpoints.", "Azure DNS alias record sets.", "ExpressRoute Global Reach.", "Network-to-network VPN only."], "answer": 0, "explanation": "Service endpoints connect virtual networks to Azure resource types such as Azure SQL databases and storage accounts, improving security and providing optimal routing."}, {"section": "Hybrid Connectivity", "question": "A single remote user needs an encrypted VPN connection from a client computer into an Azure virtual network. Which connectivity type fits best?", "options": ["Point-to-site VPN.", "Site-to-site VPN.", "ExpressRoute circuit only.", "Virtual network peering only."], "answer": 0, "explanation": "Point-to-site VPN connections are initiated by a client computer outside the environment to connect through an encrypted VPN connection to the Azure virtual network."}, {"section": "Hybrid Connectivity", "question": "An organization needs its on-premises VPN device to connect to an Azure VPN gateway so Azure resources can appear as part of the local network. Which connectivity type is this?", "options": ["Site-to-site VPN.", "Point-to-site VPN.", "Private DNS zone delegation.", "Alias record set."], "answer": 0, "explanation": "Site-to-site VPNs link an on-premises VPN device or gateway to an Azure VPN gateway in a virtual network. The encrypted connection works over the internet."}, {"section": "Hybrid Connectivity", "question": "A company needs dedicated private connectivity to Azure that does not travel over the internet and provides greater bandwidth and higher security. Which option should be selected?", "options": ["Azure ExpressRoute.", "Point-to-site VPN.", "Network security group.", "Azure DNS public zone."], "answer": 0, "explanation": "Azure ExpressRoute provides dedicated private connectivity to Azure that does not travel over the internet and is useful for greater bandwidth and higher security needs."}, {"section": "Routing", "question": "By default, how does Azure handle traffic routing in connected networking scenarios?", "options": ["Azure routes traffic among subnets, connected networks, on-premises, and the internet.", "Azure blocks subnet-to-subnet traffic until ExpressRoute is configured.", "Azure forwards traffic through public DNS name servers.", "Azure needs a network virtual appliance before a route can exist."], "answer": 0, "explanation": "By default, Azure routes traffic between subnets on connected virtual networks, on-premises networks, and the internet."}, {"section": "Route Tables", "question": "An administrator needs custom rules that define how packets are routed between subnets. Which feature should be used?", "options": ["Route tables.", "Azure DNS alias record sets.", "Public endpoints.", "Availability zones only."], "answer": 0, "explanation": "Route tables let administrators define rules about how traffic should be directed and can control how packets are routed between subnets."}, {"section": "Routing", "question": "Which routing protocol can work with Azure VPN gateways, Azure Route Server, or Azure ExpressRoute to propagate on-premises routes into Azure virtual networks?", "options": ["Border Gateway Protocol (BGP).", "Domain Name System (DNS).", "Hypertext Transfer Protocol Secure (HTTPS).", "Simple Mail Transfer Protocol (SMTP)."], "answer": 0, "explanation": "BGP works with Azure VPN gateways, Azure Route Server, or Azure ExpressRoute to propagate on-premises BGP routes to Azure virtual networks."}, {"section": "User-defined Routes", "question": "A networking team needs greater control over routing tables between subnets within a virtual network and between virtual networks. Which feature provides this control?", "options": ["User-defined routes (UDR).", "Azure DNS private domains only.", "Public load balancer probes only.", "VPN gateway active/standby failover only."], "answer": 0, "explanation": "User-defined routes let you control routing tables between subnets within a virtual network or between virtual networks, giving greater control over traffic flow."}, {"section": "Network Security Groups", "question": "A subnet requires rules that allow or block traffic based on source IP address, destination IP address, port, and protocol. Which Azure resource should be used?", "options": ["Network security group.", "Azure DNS zone.", "ExpressRoute Global Reach.", "Virtual network peering only."], "answer": 0, "explanation": "Network security groups contain inbound and outbound security rules that allow or block traffic based on factors such as source and destination IP address, port, and protocol."}, {"section": "Network Virtual Appliances", "question": "A team needs a specialized Azure VM to perform a network function such as firewall processing or WAN optimization. Which option matches this requirement?", "options": ["Network virtual appliance.", "Azure DNS alias record set.", "Private endpoint.", "Policy-based VPN selector."], "answer": 0, "explanation": "Network virtual appliances are specialized VMs that perform network functions such as running a firewall or performing WAN optimization."}, {"section": "Virtual Network Peering", "question": "Two Azure virtual networks must connect directly so their resources can communicate privately over the Microsoft backbone network. Which feature should be used?", "options": ["Virtual network peering.", "Public DNS forwarding.", "Point-to-site VPN configured per individual VM.", "A public endpoint placed on each resource."], "answer": 0, "explanation": "Virtual network peering connects two virtual networks directly. Traffic between peered networks is private, travels over the Microsoft backbone network, and does not enter the public internet."}, {"section": "Virtual Network Peering", "question": "A team wants to build a global interconnected Azure network across separate regions. Which virtual networking capability supports this scenario?", "options": ["Virtual network peering between virtual networks in separate regions.", "Network security groups between DNS zones.", "A single private endpoint in one subnet.", "Only Basic public IP addresses."], "answer": 0, "explanation": "Peered virtual networks can be in separate regions, enabling a global interconnected network through Azure."}, {"section": "Azure VPN", "question": "Which description best matches a virtual private network in the Azure fundamentals material?", "options": ["An encrypted tunnel used to connect trusted private networks over an untrusted one.", "A DNS hosting service for both public and private domain records.", "A connectivity-provider circuit that keeps traffic off the public internet.", "A subnet-level rule collection that filters traffic by port and protocol."], "answer": 0, "explanation": "A VPN uses an encrypted tunnel within another network and is typically deployed to connect trusted private networks over an untrusted network such as the public internet."}, {"section": "Azure VPN Gateway", "question": "Where is an Azure VPN Gateway deployed?", "options": ["In a dedicated subnet of the virtual network.", "Inside Azure DNS as an alias record set.", "Only inside an on-premises datacenter router.", "In each subnet of the virtual network automatically."], "answer": 0, "explanation": "Azure VPN Gateway instances are deployed in a dedicated subnet of the virtual network."}, {"section": "Azure VPN Gateway", "question": "Which set of connectivity scenarios can an Azure VPN Gateway support?", "options": ["Site-to-site, point-to-site, and network-to-network connections.", "DNS queries, certificate revocation checks, and CDN requests.", "Azure DNS public zone hosting for external domains.", "Public internet load balancing for hosted web apps."], "answer": 0, "explanation": "VPN gateways can connect on-premises datacenters through site-to-site connections, individual devices through point-to-site connections, and virtual networks through network-to-network connections."}, {"section": "Azure VPN Gateway", "question": "How many VPN gateways can be deployed in a single Azure virtual network according to the material?", "options": ["Only one VPN gateway per virtual network.", "One VPN gateway per subnet.", "One VPN gateway per Azure region pair.", "Unlimited VPN gateways without subnet requirements."], "answer": 0, "explanation": "The material states that only one VPN gateway can be deployed in each virtual network, although one gateway can connect to multiple locations."}, {"section": "VPN Types", "question": "What is the main distinction between policy-based and route-based VPN gateways?", "options": ["How they determine which traffic needs encryption.", "Whether the connection can ever use encryption.", "Whether Azure DNS is enabled for the subscription.", "Whether virtual network peering is global or regional."], "answer": 0, "explanation": "The primary distinction is how the VPN type determines which traffic needs encryption."}, {"section": "VPN Authentication", "question": "In Azure, which authentication method is used according to the fundamentals material regardless of VPN type?", "options": ["A preshared key.", "An Azure DNS alias record.", "A public load balancer probe.", "A CDN endpoint certificate only."], "answer": 0, "explanation": "The material states that in Azure, regardless of VPN type, the authentication method employed is a preshared key."}, {"section": "Policy-based VPN", "question": "Which statement describes policy-based VPN gateways?", "options": ["They statically specify which packet IP addresses are encrypted per tunnel.", "They model IPSec tunnels as interfaces and pick a tunnel by dynamic routing.", "They depend on ExpressRoute Global Reach before sending any packet.", "They serve a single purpose of hosting private DNS zones."], "answer": 0, "explanation": "Policy-based VPN gateways statically specify the IP addresses of packets to encrypt through each tunnel and evaluate packets against those address sets."}, {"section": "Route-based VPN", "question": "Which statement describes route-based VPN gateways?", "options": ["IPSec tunnels act as interfaces, and IP routing picks the tunnel for each packet.", "Packets are evaluated against fixed IP address sets with no route selection.", "They act as DNS name servers hosted on Azure's global network.", "They act as public endpoints reachable from anywhere on the internet."], "answer": 0, "explanation": "In route-based gateways, IPSec tunnels are modeled as a network interface or virtual tunnel interface, and IP routing chooses the tunnel interface for each packet."}, {"section": "Route-based VPN", "question": "Why are route-based VPNs preferred for on-premises devices in the material?", "options": ["They tolerate topology changes such as new subnets being added.", "They strip encryption from traffic in order to improve raw speed.", "They operate without any IP routing or tunnel interface model.", "They remove the need for an Azure virtual network entirely."], "answer": 0, "explanation": "Route-based VPNs are the preferred connection method for on-premises devices because they are more resilient to topology changes, such as adding new subnets."}, {"section": "Route-based VPN", "question": "Which requirement indicates that a route-based VPN gateway should be used?", "options": ["Coexistence with an Azure ExpressRoute gateway.", "Hosting public DNS records only.", "Avoiding the use of encrypted tunnels.", "Using only a policy selector for a single static IP range."], "answer": 0, "explanation": "The material lists coexistence with an Azure ExpressRoute gateway as one of the cases where a route-based VPN gateway should be used."}, {"section": "VPN High Availability", "question": "What is the default deployment configuration for Azure VPN gateways?", "options": ["Two instances in an active/standby configuration.", "One public DNS server with no standby instance.", "Two active ExpressRoute circuits only.", "A single on-premises VPN device with no Azure instance."], "answer": 0, "explanation": "By default, VPN gateways are deployed as two instances in an active/standby configuration, even though only one VPN gateway resource is visible in Azure."}, {"section": "VPN High Availability", "question": "During planned maintenance or an unplanned disruption in an active/standby VPN gateway, what happens when the active instance is affected?", "options": ["The standby instance automatically assumes responsibility for the connections without user intervention.", "VPN connections are recreated from scratch by an administrator.", "Azure DNS swaps the alias record set for a CDN endpoint.", "ExpressRoute Global Reach disables the VPN gateway permanently."], "answer": 0, "explanation": "When maintenance or disruption affects the active instance, the standby instance automatically takes over connections without user intervention."}, {"section": "VPN High Availability", "question": "A company wants both VPN gateway instances to be active and to use BGP with separate tunnels from the on-premises device to each instance. Which configuration is required?", "options": ["Active/active VPN gateway configuration.", "Active/standby VPN gateway configuration.", "Policy-based VPN gateway without BGP.", "Zone-redundant gateway in a single zone."], "answer": 0, "explanation": "In an active/active configuration, each VPN gateway instance gets a unique public IP address, and separate tunnels are created from the on-premises device to each IP address. This is supported with BGP."}, {"section": "ExpressRoute Failover", "question": "An organization uses ExpressRoute but wants an alternative connectivity path if the ExpressRoute circuit location has an outage. Which design matches the material?", "options": ["Provision a VPN gateway that uses the internet as a secure failover path.", "Replace the virtual network with Azure DNS public zones.", "Use only virtual network peering to the on-premises datacenter.", "Disable private connectivity until the circuit is restored."], "answer": 0, "explanation": "A VPN gateway can be configured as a secure failover path for ExpressRoute connections, using the internet as an alternative connectivity method."}, {"section": "Zone-redundant Gateways", "question": "In regions that support availability zones, why deploy VPN gateways or ExpressRoute gateways in a zone-redundant configuration?", "options": ["They separate gateways across zones for resiliency and availability.", "They make DNS queries stop traversing the public internet path.", "They remove the need for a dedicated gateway subnet entirely.", "They turn a public endpoint into a subnet-level route table."], "answer": 0, "explanation": "Zone-redundant gateways bring resiliency, scalability, and higher availability by separating gateways across availability zones within a region and protecting connectivity from zone-level failures."}, {"section": "Zone-redundant Gateways", "question": "Which requirement is associated with zone-redundant virtual network gateways in the material?", "options": ["They need different gateway SKUs and Standard public IP addresses.", "They keep Basic public IP addresses with no change of gateway SKU.", "They depend on Azure DNS alias records as the routing mechanism.", "They restrict connections so that only policy-based VPN is used."], "answer": 0, "explanation": "The material states that zone-redundant gateways require different gateway SKUs and use Standard public IP addresses instead of Basic public IP addresses."}, {"section": "Azure ExpressRoute", "question": "Which description best matches Azure ExpressRoute?", "options": ["A private connection through a provider that extends on-premises networks into Azure.", "A public DNS hosting service that performs name resolution on Azure infrastructure.", "A subnet-level firewall rule collection that filters by port and protocol.", "A client-initiated encrypted VPN tunnel from a laptop into a virtual network."], "answer": 0, "explanation": "ExpressRoute extends on-premises networks into the Microsoft cloud over a private connection with help from a connectivity provider. The connection is called an ExpressRoute circuit."}, {"section": "Azure ExpressRoute", "question": "Why can ExpressRoute provide more reliability, faster speeds, consistent latencies, and higher security than typical internet connections?", "options": ["ExpressRoute connections do not travel over the public internet.", "ExpressRoute uses public endpoints reachable from anywhere.", "ExpressRoute swaps DNS queries for private endpoints.", "ExpressRoute depends on policy-based VPN packet selectors."], "answer": 0, "explanation": "ExpressRoute connections bypass the public internet, which provides more reliability, faster speeds, consistent latencies, and higher security than typical internet connections."}, {"section": "Azure ExpressRoute", "question": "Which connectivity model is included as an ExpressRoute option in the material?", "options": ["An any-to-any IP VPN, point-to-point Ethernet, or virtual cross-connection.", "A point-to-site VPN initiated from individual client devices over the internet.", "A virtual network peering link established between two Azure virtual networks.", "An Azure DNS anycast configuration that performs global name resolution."], "answer": 0, "explanation": "ExpressRoute connectivity can be from an any-to-any IP VPN network, point-to-point Ethernet network, or virtual cross-connection through a provider at a colocation facility."}, {"section": "ExpressRoute Benefits", "question": "Which set of benefits is specifically listed for ExpressRoute?", "options": ["Cross-region cloud connectivity, Global Reach, BGP dynamic routing, and built-in redundancy.", "Public endpoint access, subnet filtering, alias records, and function triggers.", "DNS hosting, REST API management, resource locks, and private DNS domains.", "Active/standby VPN failover, policy selectors, and Basic public IP addresses."], "answer": 0, "explanation": "The material lists connectivity to Microsoft cloud services across regions, ExpressRoute Global Reach, BGP dynamic routing, and built-in redundancy in every peering location."}, {"section": "ExpressRoute Services", "question": "Which Microsoft services does ExpressRoute provide direct access to across regions, according to the material?", "options": ["Microsoft 365, Dynamics 365, Azure compute services, and Azure cloud services.", "Only on-premises Active Directory and local file servers.", "Only third-party SaaS applications outside the Microsoft cloud.", "Only public internet websites reached through a proxy."], "answer": 0, "explanation": "ExpressRoute enables direct access to Microsoft Office 365, Microsoft Dynamics 365, Azure compute services such as Azure Virtual Machines, and Azure cloud services such as Azure Cosmos DB and Azure Storage."}, {"section": "ExpressRoute Global Reach", "question": "A company has an office in Asia and a datacenter in Europe, each connected to Microsoft through ExpressRoute. It wants the two sites to exchange data without using the public internet. Which feature applies?", "options": ["ExpressRoute Global Reach.", "Azure DNS alias records.", "Point-to-site VPN.", "Network security group service tags only."], "answer": 0, "explanation": "ExpressRoute Global Reach connects ExpressRoute circuits so on-premises sites can exchange data through the Microsoft network without transferring data over the public internet."}, {"section": "ExpressRoute Dynamic Routing", "question": "What does ExpressRoute's use of dynamic routing provide for on-premises-to-Azure connectivity?", "options": ["Routes are exchanged and updated as the connected networks change.", "Routes are fixed at circuit creation and never change afterward.", "Routes are resolved through Azure DNS anycast lookups.", "Routes are selected by network security group service tags."], "answer": 0, "explanation": "ExpressRoute uses BGP, a dynamic routing protocol, so routes between on-premises networks and Microsoft cloud services are exchanged and kept current as the networks change."}, {"section": "ExpressRoute Redundancy", "question": e still sent over the public internet."}, {"section": "Azure DNS", "question": "Which description best matches Azure DNS?", "options": ["A hosting service for DNS domains using Microsoft Azure infrastructure.", "A private circuit that links on-premises networks to Microsoft cloud services.", "A virtual network gateway for encrypted tunnels carried over the internet.", "A subnet route table used to direct packet forwarding between subnets."], "answer": 0, "explanation": "Azure DNS is a hosting service for DNS domains that provides name resolution by using Microsoft Azure infrastructure."}, {"section": "Azure DNS", "question": "Why can Azure DNS simplify DNS management for Azure-based environments?", "options": ["Records use the same credentials, APIs, tools, and billing as Azure services.", "Records are managed from a separate portal outside the Azure environment.", "Records can be changed by the connectivity provider on the customer's behalf.", "Record management depends on a VPN gateway in each virtual network."], "answer": 0, "explanation": "By hosting domains in Azure, DNS records can be managed using the same credentials, APIs, tools, and billing as other Azure services."}, {"section": "Azure DNS Reliability", "question": "How does Azure DNS provide fast performance and high availability for DNS queries?", "options": ["It uses a global DNS name-server network with anycast, so the nearest server answers.", "It directs queries through one gateway subnet in a single virtual network.", "It sends each DNS query across an ExpressRoute circuit before it is answered.", "It answers DNS queries that originate from on-premises VPN devices alone."], "answer": 0, "explanation": "Azure DNS hosts domains on Azure's global DNS name server network and uses anycast networking, so the closest available DNS server answers each query."}, {"section": "Azure DNS Security", "question": "Which Azure Resource Manager features help protect Azure DNS resources and records?", "options": ["A let current=0, score=0, checked=false, userAnswers=Array(questions.length).fill(null);
let shuffledOptions = [];
let correctSet = [];
const $=id=>document.getElementById(id);

function isMulti(q){return Array.isArray(q.answer);}

function shuffleArray(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function updateLiveScore(){
  const percent = current === 0 && score === 0 ? 0 : Math.round((score / questions.length) * 100);
  $('scoreLive').textContent = `Score: ${score} / ${questions.length} (${percent}%)`;
}

function renderQuestion(){
  const q=questions[current];
  checked=false;
  const answerArr = isMulti(q) ? q.answer : [q.answer];
  shuffledOptions = shuffleArray(q.options.map((text, originalIndex)=>({text, originalIndex})));
  correctSet = shuffledOptions.map((o,idx)=>answerArr.includes(o.originalIndex)?idx:-1).filter(x=>x>=0);

  $('counter').textContent=`Question ${current+1} of ${questions.length}`;
  updateLiveScore();
  $('progressFill').style.width=`${(current/questions.length)*100}%`;
  $('section').textContent=q.section;
  $('question').innerHTML=q.question;
  $('hint').textContent = isMulti(q) ? `Select ${q.selectCount}.` : '';
  $('feedback').classList.remove('show');
  $('status').textContent='';
  $('explanation').textContent='';
  $('nextBtn').disabled=true;
  $('checkBtn').disabled=false;
  $('options').innerHTML='';

  const inputType = isMulti(q) ? 'checkbox' : 'radio';
  shuffledOptions.forEach((option,index)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML=`<input type="${inputType}" name="answer" value="${index}"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${option.text}</span>`;
    $('options').appendChild(label);
  });

}

function enforceLimit(){
  const q=questions[current];
  if(!isMulti(q))return;
  const boxes=[...document.querySelectorAll('input[name="answer"]')];
  const checkedCount=boxes.filter(b=>b.checked).length;
  boxes.forEach(b=>{ b.disabled = (!b.checked && checkedCount>=q.selectCount); });
}

function selectedIndices(){
  return [...document.querySelectorAll('input[name="answer"]:checked')].map(b=>Number(b.value));
}

function checkAnswer(){
  if(checked)return;
  const q=questions[current];
  const sel=selectedIndices();
  const need = isMulti(q) ? q.selectCount : 1;
  if(sel.length!==need){
    $('feedback').classList.add('show');
    $('status').textContent = isMulti(q) ? `Please select ${q.selectCount} option(s).` : 'Please select an answer.';
    $('status').className='status';
    $('explanation').textContent='';
    return;
  }
  checked=true;
  const correctSorted=[...correctSet].sort((a,b)=>a-b).join(',');
  const selSorted=[...sel].sort((a,b)=>a-b).join(',');
  const ok = correctSorted===selSorted;
  if(ok)score++;

  userAnswers[current]={
    selectedText: sel.map(i=>shuffledOptions[i].text).join(' | '),
    correctText: correctSet.map(i=>shuffledOptions[i].text).join(' | '),
    ok: ok
  };

  document.querySelectorAll('.option').forEach((el,index)=>{
    el.querySelector('input').disabled=true;
    if(correctSet.includes(index))el.classList.add('correct');
    if(sel.includes(index)&&!correctSet.includes(index))el.classList.add('wrong');
  });

  $('feedback').classList.add('show');
  $('status').textContent=ok?'Correct':'Incorrect';
  $('status').className='status '+(ok?'ok':'bad');
  $('explanation').textContent=q.explanation;
  updateLiveScore();
  $('nextBtn').disabled=false;
  $('checkBtn').disabled=true;
}

function nextQuestion(){if(current<questions.length-1){current++;renderQuestion();}else showResults();}

function showResults(){
  $('progressFill').style.width='100%';
  $('quizArea').classList.add('hidden');
  $('results').classList.add('show');

  const percent=Math.round(score/questions.length*100);
  $('finalScore').textContent=`${score} / ${questions.length} (${percent}%)`;
  $('finalText').textContent=percent>=85
    ?'Отличный результат. Материал по Azure networking services усвоен хорошо.'
    :percent>=70
      ?'Хороший результат, но стоит повторить ошибки: особенно различия между Azure Virtual Network, VPN Gateway, ExpressRoute и Azure DNS.'
      :'Нужно повторить раздел Describe Azure networking services и пройти тест ещё раз.';

  $('review').innerHTML='';
  questions.forEach((q,i)=>{
    const ua=userAnswers[i];
    const ok=ua!==null && ua.ok;
    const correctText = isMulti(q) ? q.answer.map(a=>q.options[a]).join(' | ') : q.options[q.answer];
    const item=document.createElement('div');
    item.className='review-item';
    item.innerHTML=`<strong>${i+1}. ${q.section}</strong><br>${q.question}<br><span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ua===null?'Not answered':(ok?'Correct':'Incorrect')}</span><br>Your answer: ${ua===null?'No answer':ua.selectedText}<br>Correct answer: ${ua===null?correctText:ua.correctText}<br><em>${q.explanation}</em>`;
    $('review').appendChild(item);
  });
}

function hashStr(s){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){
    const ch=s.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function todayStrLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
async function ensureRWPermission(handle){
  const opts={mode:'readwrite'};
  if((await handle.queryPermission(opts))==='granted') return true;
  if((await handle.requestPermission(opts))==='granted') return true;
  return false;
}
function downloadFallbackExport(quizTitle, missed){
  const payload={quizTitle, date:todayStrLocal(), mistakes:missed};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safe=quizTitle.replace(/[^\w\-]+/g,'_').slice(0,60);
  a.href=url; a.download='mistakes_'+safe+'_'+todayStrLocal()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function exportMistakesToJournal(forceCreate){
  const quizTitle = document.title || 'AZ-104 Quiz';
  const missed = [];
  questions.forEach((q,i)=>{
    const ua = userAnswers[i];
    if(!ua || !ua.ok){
      missed.push({section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount||null, explanation:q.explanation});
    }
  });
  if(missed.length===0){ alert('Ошибок нет — нечего экспортировать.'); return; }
  if(!('showOpenFilePicker' in window)){
    alert('Браузер не поддерживает прямую запись в файл (нужен Chrome/Edge). Скачиваю отдельный файл — импортируйте его вручную в Журнал ошибок.');
    downloadFallbackExport(quizTitle, missed);
    return;
  }
  let handle;
  try{
    if(forceCreate){
      handle = await window.showSaveFilePicker({suggestedName:'az104-mistakes-journal.json', types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    } else {
      [handle] = await window.showOpenFilePicker({types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    }
  }catch(e){ if(e.name!=='AbortError') console.error(e); return; }

  let journal;
  try{
    const perm = await ensureRWPermission(handle);
    if(!perm){ alert('Нет разрешения на запись в файл.'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    journal = text.trim() ? JSON.parse(text) : {mistakes:[]};
    if(!journal.mistakes || !Array.isArray(journal.mistakes)) journal.mistakes=[];
  }catch(e){ alert('Не удалось прочитать файл журнала: '+e.message); return; }

  let added=0, reset=0;
  missed.forEach(q=>{
    const id = hashStr(quizTitle+'|'+q.section+'|'+q.question);
    const existing = journal.mistakes.find(m=>m.id===id);
    if(existing){ existing.box=1; existing.masteredStreak=0; existing.nextReview=todayStrLocal(); reset++; }
    else{
      journal.mistakes.push({id, quizTitle, domain:null, section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount, explanation:q.explanation, box:1, masteredStreak:0, nextReview:todayStrLocal(), firstMissed:todayStrLocal()});
      added++;
    }
  });
  try{
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(journal,null,2));
    await writable.close();
  }catch(e){ alert('Не удалось сохранить журнал: '+e.message); return; }
  alert(`Готово. Новых вопросов: ${added}, повторно ошиблись: ${reset}.`);
}

function restart(){current=0;score=0;checked=false;userAnswers=Array(questions.length).fill(null);$('results').classList.remove('show');$('quizArea').classList.remove('hidden');renderQuestion();}
$('options').addEventListener('change',enforceLimit);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);$('restartBtn').addEventListener('click',restart);$('restartBtn2').addEventListener('click',restart);$('exportMistakesBtn').addEventListener('click',()=>exportMistakesToJournal(false));$('createJournalBtn').addEventListener('click',()=>exportMistakesToJournal(true));renderQuestion();
</script></body></html>
