;background:var(--accent);color:#062131}button.secondary{background:rgba(255,255,255,.12);color:var(--text);border:1px solid var(--border)}button:disabled{opacity:.45;cursor:not-allowed}.feedback{display:none;margin-top:22px;padding:18px;border-radius:14px;border:1px solid var(--border);background:rgba(8,25,34,.55);line-height:1.55}.feedback.show{display:block}.status{font-weight:800;margin-bottom:8px}.ok{color:var(--correct)}.bad{color:var(--wrong)}.results{display:none;padding:32px;line-height:1.55}.results.show{display:block}.score{font-size:42px;font-weight:800;margin:12px 0;color:var(--accent2)}.review{margin-top:24px;display:grid;gap:12px}.review-item{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:rgba(8,25,34,.45)}.review-item strong{color:var(--accent2)}.hidden{display:none}@media(max-width:640px){body{padding:12px}header,main,.progress-wrap,.results{padding-left:18px;padding-right:18px}.question{font-size:20px}h1{font-size:22px}}

<script>
const questions = [{"section": "High availability", "question": "What does high availability focus on in cloud computing?", "options": ["Maximum availability despite disruptions or events", "Reducing how many users can reach a service", "Procuring servers ahead of rising demand", "Replacing access controls with automation"], "answer": 0, "explanation": "High availability focuses on ensuring maximum availability, regardless of disruptions or events that may occur."}, {"section": "High availability", "question": "In Azure, uptime guarantees for a service are defined as part of what?", "options": ["A service-level agreement (SLA)", "A role-based access assignment", "A resource tagging policy", "A network security group rule"], "answer": 0, "explanation": "Azure uptime guarantees depend on the service and are part of the service-level agreements (SLAs)."}, {"section": "High availability", "question": "Why account for service availability guarantees when architecting a solution?", "options": ["They set expected uptime and resilience commitments", "They decide the region's physical wiring layout", "They remove the need to pick a cloud model", "They define the app's programming language"], "answer": 0, "explanation": "Availability guarantees, expressed through SLAs, tell you the uptime and resilience you can expect when designing a solution."}, {"section": "High availability", "question": "A business-critical application must stay available during disruptions. Which cloud benefit is most relevant?", "options": ["High availability", "Capital expenditure planning", "Vertical scale down", "Single-region deployment"], "answer": 0, "explanation": "High availability is the benefit focused on keeping resources available when needed, regardless of disruptions."}, {"section": "Scalability", "question": "What does scalability mean in cloud computing?", "options": ["Adjusting resources to meet demand", "Removing the solution's access controls", "Restricting workloads to one datacenter", "Eliminating every operating cost"], "answer": 0, "explanation": "Scalability refers to the ability to adjust resources to meet demand."}, {"section": "Scalability", "question": "How does scalability help control cost in a consumption-based model?", "options": ["Resources can be reduced when demand drops", "Every deployed resource becomes free", "Maximum capacity must run permanently", "The customer stops paying for any service"], "answer": 0, "explanation": "Because you pay only for what you use, reducing resources when demand drops also reduces cost."}, {"section": "Scalability", "question": "What are the two broad types of scaling commonly used in the cloud? (Choose two)", "options": ["Vertical scaling", "Horizontal scaling", "Public scaling", "Compliance scaling"], "answer": [0, 1], "selectCount": 2, "explanation": "Scaling generally comes in two varieties: vertical (changing a resource's capabilities) and horizontal (changing the number of resources)."}, {"section": "Vertical scaling", "question": "What is vertical scaling?", "options": ["Changing the capabilities of an existing resource", "Changing the number of separate instances", "Moving a workload from public to private cloud", "Creating an additional user account"], "answer": 0, "explanation": "Vertical scaling focuses on increasing or decreasing the capabilities of a resource, such as CPU or RAM."}, {"section": "Vertical scaling", "question": "Which action is an example of vertical scale up?", "options": ["Adding CPU or RAM to a virtual machine", "Adding three more virtual machines", "Deleting an existing storage account", "Adding a second cloud provider"], "answer": 0, "explanation": "Vertical scale up adds capability, such as more CPUs or RAM, to an existing virtual machine."}, {"section": "Vertical scaling", "question": "Which action is an example of vertical scale down?", "options": ["Lowering the CPU or RAM of a VM", "Adding more container instances", "Deploying into another region", "Creating a new subscription"], "answer": 0, "explanation": "Vertical scale down lowers the CPU or RAM specifications of an existing resource."}, {"section": "Horizontal scaling", "question": "What is horizontal scaling?", "options": ["Adding or removing resource instances", "Raising the CPU of one server", "Editing the password policy", "Buying physical datacenter space"], "answer": 0, "explanation": "Horizontal scaling adds or subtracts the number of resources, such as virtual machines or containers."}, {"section": "Horizontal scaling", "question": "Which action is an example of horizontal scale out?", "options": ["Adding more virtual machines or containers", "Raising the RAM of one virtual machine", "Reducing the CPU size of one server", "Turning off monitoring alerts"], "answer": 0, "explanation": "Horizontal scale out adds additional virtual machines or containers to handle increased demand."}, {"section": "Horizontal scaling", "question": "Horizontal scale out and scale in can be performed in which ways? (Choose two)", "options": ["Automatically", "Manually", "By rebuilding the datacenter", "By changing the cloud model"], "answer": [0, 1], "selectCount": 2, "explanation": "With horizontal scaling, deployed resources can be scaled out or scaled in either automatically or manually."}, {"section": "Reliability", "question": "What is reliability in cloud computing?", "options": ["Recovering from failures and continuing to function", "Avoiding every security requirement", "Making each resource publicly visible", "Stopping cost monitoring entirely"], "answer": 0, "explanation": "Reliability is the ability of a system to recover from failures and continue to function."}, {"section": "Reliability", "question": "Reliability is one of the pillars of which framework?", "options": ["Microsoft Azure Well-Architected Framework", "Microsoft Office Style Framework", "Microsoft Licensing Framework", "Azure Resource Manager Framework"], "answer": 0, "explanation": "Reliability is one of the pillars of the Microsoft Azure Well-Architected Framework."}, {"section": "Reliability", "question": "Why does a decentralized cloud design support reliability?", "options": ["Resources span regions, so one failure won't stop the solution", "All resources are forced into one building", "Backups are no longer required at all", "Users are blocked from reaching applications"], "answer": 0, "explanation": "A decentralized design deploys resources across regions, so even a catastrophic event in one region leaves others running."}, {"section": "Reliability", "question": "In some cases, when a region has a catastrophic event, what can the cloud environment do on its own?", "options": ["Shift to a different region with no action needed", "Automatically delete the affected workload", "Convert the workload into a SaaS product", "Disable the customer's other regions"], "answer": 0, "explanation": "In some cases your cloud environment automatically shifts to a different region for you, with no action needed on your part."}, {"section": "Predictability", "question": "What does predictability in the cloud help you do?", "options": ["Move forward with confidence on cost and performance", "Skip planning your deployments entirely", "Guarantee that spending will be zero", "Remove the need for any architecture"], "answer": 0, "explanation": "Predictability lets you move forward with confidence, focused on performance predictability and cost predictability."}, {"section": "Predictability", "question": "Which two kinds of predictability does the cloud emphasize? (Choose two)", "options": ["Performance predictability", "Cost predictability", "Color predictability", "Offline predictability"], "answer": [0, 1], "selectCount": 2, "explanation": "Predictability can focus on performance predictability and cost predictability, both heavily influenced by the Well-Architected Framework."}, {"section": "Performance predictability", "question": "What does performance predictability focus on?", "options": ["Predicting the resources needed for a good experience", "Predicting the Azure portal's color scheme", "Forecasting which users will sign in next", "Estimating weather near the datacenter"], "answer": 0, "explanation": "Performance predictability focuses on predicting the resources needed to deliver a positive experience for customers."}, {"section": "Performance predictability", "question": "Which cloud concepts support performance predictability? (Choose three)", "options": ["Autoscaling", "Load balancing", "High availability", "Capital expenditure"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Autoscaling, load balancing, and high availability are among the cloud concepts that support performance predictability."}, {"section": "Performance predictability", "question": "What can autoscaling do when demand suddenly increases?", "options": ["Deploy additional resources to meet demand", "Shut the application down", "Automatically erase stored customer data", "Replace the governance policies"], "answer": 0, "explanation": "Autoscaling can deploy additional resources to meet demand, then scale back when demand drops."}, {"section": "Performance predictability", "question": "How does load balancing support performance predictability?", "options": ["Redirecting overload to less stressed areas", "Turning every application into SaaS", "Removing the network controls", "Forcing traffic onto a single server"], "answer": 0, "explanation": "If traffic is heavily focused on one area, load balancing redirects some of the overload to less stressed areas."}, {"section": "Cost predictability", "question": "What does cost predictability focus on?", "options": ["Predicting or forecasting cloud spend", "Making every service free of charge", "Buying all hardware before deployment", "Removing the need for cost monitoring"], "answer": 0, "explanation": "Cost predictability focuses on predicting or forecasting the cost of cloud spend."}, {"section": "Cost predictability", "question": "Which cloud capability helps with cost predictability?", "options": ["Tracking resource use in real time", "Ignoring usage trends entirely", "Buying maximum physical capacity", "Disabling analytics features"], "answer": 0, "explanation": "In the cloud you can track resource use in real time and monitor resources to use them efficiently."}, {"section": "Cost predictability", "question": "How can data analytics help cost predictability?", "options": ["Finding patterns and trends to plan deployments", "Hiding how resources are being used", "Preventing any future scaling", "Replacing the service-level agreements"], "answer": 0, "explanation": "Data analytics finds patterns and trends that help you better plan resource deployments and predict future costs."}, {"section": "Cost predictability", "question": "Which Azure tool can estimate potential cloud spend?", "options": ["Azure Pricing Calculator", "Azure VMware Solution", "Azure Arc", "Azure Resource Manager"], "answer": 0, "explanation": "You can use tools like the Azure Pricing Calculator to get an estimate of potential cloud spend."}, {"section": "Security and governance", "question": "What do cloud governance features help organizations meet?", "options": ["Technical standards and regulatory requirements", "Only the portal's interface colors", "Only local file access settings", "A way to avoid all policies"], "answer": 0, "explanation": "Cloud governance features help ensure deployed resources meet your technical standards and regulatory requirements."}, {"section": "Security and governance", "question": "How can templates support governance?", "options": ["Deploying resources consistently to standards", "Removing the need for security controls", "Making every resource public by default", "Preventing resources from being monitored"], "answer": 0, "explanation": "Templates help ensure deployed resources meet technical standards and can be updated at scale as standards change."}, {"section": "Security and governance", "question": "What can cloud-based auditing help identify?", "options": ["Resources out of compliance with a baseline", "The most popular hardware vendor", "Future weather at the datacenter", "Stored user account passwords"], "answer": 0, "explanation": "Cloud-based auditing flags resources that are out of compliance with your baseline and provides mitigation strategies."}, {"section": "Security and governance", "question": "Which cloud service type gives the customer maximum control over operating systems and installed software?", "options": ["Infrastructure as a Service (IaaS)", "Software as a Service (SaaS)", "A managed software-as-a-service app", "Platform as a Service (PaaS)"], "answer": 0, "explanation": "For maximum control of security, IaaS provides physical resources but lets you manage the OS and installed software, including patches."}, {"section": "Security and governance", "question": "Which service models may be better when you want patches and maintenance handled automatically? (Choose two)", "options": ["Platform as a Service (PaaS)", "Software as a Service (SaaS)", "Infrastructure as a Service (IaaS)", "On-premises datacenter"], "answer": [0, 1], "selectCount": 2, "explanation": "If you want patches and maintenance handled automatically, PaaS or SaaS deployments may be the best strategies."}, {"section": "Security and governance", "question": "Which security threat are cloud providers typically well suited to help handle?", "options": ["Distributed denial of service (DDoS) attacks", "Misformatted internal documents", "Forgotten meeting notes", "Office printer malfunctions"], "answer": 0, "explanation": "Cloud providers are typically well suited to handle things like DDoS attacks, making your network more robust and secure."}, {"section": "Security and governance", "question": "Why is establishing a governance footprint early useful?", "options": ["It keeps the cloud footprint updated and secure", "It removes all customer responsibility", "It blocks any resource from deploying", "It guarantees unlimited free usage"], "answer": 0, "explanation": "By establishing a good governance footprint early, you keep your cloud footprint updated, secure, and well managed."}, {"section": "Security and governance", "question": "A team must ensure every new resource follows naming, tagging, and compliance rules. Which cloud benefit is most relevant?", "options": ["Governance", "Vertical scaling", "High availability", "Cost predictability"], "answer": 0, "explanation": "Governance features and templates help enforce standards such as naming, tagging, and compliance across resources."}, {"section": "Manageability", "question": "What are the two types of manageability described for cloud computing? (Choose two)", "options": ["Management of the cloud", "Management in the cloud", "Management above the cloud", "Management around the cloud"], "answer": [0, 1], "selectCount": 2, "explanation": "There are two types of manageability: management of the cloud and management in the cloud."}, {"section": "Management of the cloud", "question": "What does management of the cloud refer to?", "options": ["Managing your cloud resources", "Using a single web browser session", "Writing project documentation", "Purchasing datacenter buildings"], "answer": 0, "explanation": "Management of the cloud speaks to managing your cloud resources, such as scaling, deployment, health, and alerts."}, {"section": "Management of the cloud", "question": "Which of these are part of management of the cloud? (Choose three)", "options": ["Automatically scaling deployment based on need", "Deploying from a preconfigured template", "Automatically replacing failing resources", "Buying physical servers in advance"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Management of the cloud includes auto-scaling, template-based deployment, health monitoring with automatic replacement, and metric-based alerts."}, {"section": "Management of the cloud", "question": "How do preconfigured templates improve manageability?", "options": ["They support repeatable, low-config deployments", "They block new resources from being created", "They replace the need for monitoring", "They make service-level agreements unnecessary"], "answer": 0, "explanation": "Templates let you deploy resources without manual configuration, removing repetitive setup and supporting repeatable deployments."}, {"section": "Management of the cloud", "question": "Why are automatic alerts useful?", "options": ["They notify teams about metrics in real time", "They automatically disable all monitoring", "They prevent resources from scaling", "They override all governance policies"], "answer": 0, "explanation": "Automatic alerts are based on configured metrics, so you're aware of performance in real time."}, {"section": "Management in the cloud", "question": "What does management in the cloud refer to?", "options": ["The ways you manage environments and resources", "Raising a single server's CPU size", "Lowering your monthly cost forecasts", "Selecting one deployment region"], "answer": 0, "explanation": "Management in the cloud speaks to how you manage your cloud environment and resources."}, {"section": "Management in the cloud", "question": "Which tools can be used for management in the cloud? (Choose three)", "options": ["A web portal", "A command line interface", "PowerShell", "Physical access to the servers"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "You can manage cloud resources through a web portal, a command line interface, APIs, and PowerShell."}, {"section": "Sustainability", "question": "How can cloud computing support sustainability goals?", "options": ["Optimizing how resources are deployed and used", "Keeping idle resources running indefinitely", "Preventing teams from monitoring usage", "Encouraging workloads to overprovision"], "answer": 0, "explanation": "Cloud computing supports sustainability when teams actively optimize how resources are deployed and used."}, {"section": "Sustainability", "question": "Why can large-scale cloud providers improve efficiency over many isolated on-premises environments?", "options": ["They improve resource utilization at scale", "They make each customer buy separate hardware", "They block resource sharing completely", "They remove the need to manage demand"], "answer": 0, "explanation": "Cloud providers operate at large scale, which can improve resource utilization compared with many isolated on-premises environments."}, {"section": "Sustainability", "question": "Which practices support both sustainability and cost efficiency? (Choose three)", "options": ["Scaling resources down when demand decreases", "Turning off or deallocating unused resources", "Choosing efficient services to reduce overprovisioning", "Leaving every workload provisioned at peak"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Sustainability-aligned practices include scaling down on lower demand, deallocating unused resources, and choosing efficient configurations to reduce overprovisioning."}, {"section": "Sustainability", "question": "A development environment is needed only during business hours. Which practice fits best?", "options": ["Shut it down overnight and on weekends", "Keep it running continuously unmonitored", "Increase its size every night", "Move it to more expensive hardware"], "answer": 0, "explanation": "A dev environment that runs during business hours can be automatically shut down overnight and on weekends to reduce unnecessary consumption."}, {"section": "Sustainability", "question": "Which phrase best summarizes sustainability-aligned cloud operations?", "options": ["Right-size, automate, monitor, and optimize", "Buy, ignore, overprovision, and forget", "Disable, delete, hide, and guess", "Build every server by hand"], "answer": 0, "explanation": "At a fundamentals level, sustainability ties to good operational habits: right-size, automate, monitor, and continuously optimize."}, {"section": "Scenario-Based Questions", "question": "A service must keep functioning even if one region has a major outage. Which design benefit is most relevant?", "options": ["Reliability through regional resilience", "Dependency on a single region", "Vertical scale down", "On-premises local storage"], "answer": 0, "explanation": "Decentralized, multi-region design gives reliability: if one region fails, others keep the solution running."}, {"section": "Scenario-Based Questions", "question": "An operations team wants a real-time notification when CPU usage crosses a threshold. What should it configure?", "options": ["Metric-based alerts", "Manual hardware procurement", "Vertical scale down", "A new subscription"], "answer": 0, "explanation": "Automatic alerts based on configured metrics notify teams about performance in real time."}, {"section": "Scenario-Based Questions", "question": "A workload is overprovisioned and uses far more CPU and RAM than needed. Which action optimizes it?", "options": ["Vertically scale the resource down", "Add more idle instances", "Disable resource monitoring", "Increase its capacity further"], "answer": 0, "explanation": "Lowering the CPU or RAM (vertical scale down) right-sizes an over-specified resource and reduces waste."}, {"section": "Scenario-Based Questions", "question": "A team wants to automate recurring administrative tasks for Azure resources. Which option fits?", "options": ["CLI or PowerShell scripts", "Manual clicks each time", "Physical server access", "Printed run-books"], "answer": 0, "explanation": "Teams automate recurring tasks with CLI or PowerShell scripts, reducing manual effort and keeping configurations consistent."}];
let current=0, score=0, checked=false, userAnswers=Array(questions.length).fill(null);
let shuffledOptions = [];
let currentCorrectSet = [];
const $=id=>document.getElementById(id);

function isMulti(q){return Array.isArray(q.answer);}

function shuffleArray(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function updateLiveScore(){
  const percent = current === 0 && score === 0 ? 0 : Math.round((score / questions.length) * 100);
  $('scoreLive').textContent = `Score: ${score} / ${questions.length} (${percent}%)`;
}
function renderQuestion(){
  const q=questions[current];
  checked=false;
  const multi=isMulti(q);
  const correctOriginal = multi ? q.answer.slice() : [q.answer];
  shuffledOptions = shuffleArray(q.options.map((text, originalIndex)=>({text, originalIndex})));
  currentCorrectSet = shuffledOptions
    .map((o,idx)=>({idx, orig:o.originalIndex}))
    .filter(o=>correctOriginal.includes(o.orig))
    .map(o=>o.idx);

  $('counter').textContent=`Question ${current+1} of ${questions.length}`;
  updateLiveScore();
  $('progressFill').style.width=`${(current/questions.length)*100}%`;
  $('section').textContent=q.section;
  $('question').innerHTML=q.question;
  $('feedback').classList.remove('show');
  $('status').textContent='';
  $('explanation').textContent='';
  $('nextBtn').disabled=true;
  $('checkBtn').disabled=false;
  $('options').innerHTML='';

  const inputType = multi ? 'checkbox' : 'radio';
  shuffledOptions.forEach((option,index)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML=`<input type="${inputType}" name="answer" value="${index}"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${option.text}</span>`;
    $('options').appendChild(label);
  });

  if(multi){
    const need=q.selectCount;
    const inputs=()=>Array.from(document.querySelectorAll('input[name="answer"]'));
    inputs().forEach(inp=>{
      inp.addEventListener('change',()=>{
        const chosen=inputs().filter(i=>i.checked);
        if(chosen.length>=need){
          inputs().forEach(i=>{if(!i.checked)i.disabled=true;});
        }else{
          inputs().forEach(i=>{i.disabled=false;});
        }
      });
    });
  }
}
function selectedIndexes(){
  return Array.from(document.querySelectorAll('input[name="answer"]:checked')).map(i=>Number(i.value));
}
function checkAnswer(){
  if(checked)return;
  const q=questions[current];
  const multi=isMulti(q);
  const selected=selectedIndexes();
  if(selected.length===0 || (multi && selected.length<q.selectCount)){
    $('feedback').classList.add('show');
    $('status').textContent = multi ? `Выберите ${q.selectCount} варианта.` : 'Выберите вариант ответа.';
    $('status').className='status';
    $('explanation').textContent='';
    return;
  }
  checked=true;
  const correctSetSorted=[...currentCorrectSet].sort((a,b)=>a-b);
  const selectedSorted=[...selected].sort((a,b)=>a-b);
  const ok = correctSetSorted.length===selectedSorted.length &&
             correctSetSorted.every((v,i)=>v===selectedSorted[i]);
  if(ok)score++;

  const selectedText = selected.map(i=>shuffledOptions[i].text).join('; ');
  const correctText = currentCorrectSet.map(i=>shuffledOptions[i].text).join('; ');
  userAnswers[current]={selectedText, correctText, ok};

  document.querySelectorAll('.option').forEach((el,index)=>{
    el.querySelector('input').disabled=true;
    if(currentCorrectSet.includes(index))el.classList.add('correct');
    if(selected.includes(index)&&!currentCorrectSet.includes(index))el.classList.add('wrong');
  });

  $('feedback').classList.add('show');
  $('status').textContent=ok?'Correct':'Incorrect';
  $('status').className='status '+(ok?'ok':'bad');
  $('explanation').textContent=q.explanation;
  updateLiveScore();
  $('nextBtn').disabled=false;
  $('checkBtn').disabled=true;
}
function nextQuestion(){if(current<questions.length-1){current++;renderQuestion();}else showResults();}
function showResults(){
  $('progressFill').style.width='100%';
  $('quizArea').classList.add('hidden');
  $('results').classList.add('show');

  const percent=Math.round(score/questions.length*100);
  $('finalScore').textContent=`${score} / ${questions.length} (${percent}%)`;
  $('finalText').textContent=percent>=85
    ?'Отличный результат. Материал раздела Describe the benefits of using cloud services усвоен.'
    :percent>=70
      ?'Хороший результат, но стоит повторить ошибки и пройти вопросник ещё раз.'
      :'Нужно повторить раздел Describe the benefits of using cloud services и заново пройти вопросник.';

  $('review').innerHTML='';

  questions.forEach((q,i)=>{
    const ua=userAnswers[i];
    const ok=ua!==null && ua.ok;
    const correctDisplay = Array.isArray(q.answer)
      ? q.answer.map(a=>q.options[a]).join('; ')
      : q.options[q.answer];

    const item=document.createElement('div');
    item.className='review-item';
    item.innerHTML=`<strong>${i+1}. ${q.section}</strong><br>${q.question}<br><span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ok?'Correct':'Incorrect'}</span><br>Your answer: ${ua===null?'No answer':ua.selectedText}<br>Correct answer: ${ua===null?correctDisplay:ua.correctText}<br><em>${q.explanation}</em>`;
    $('review').appendChild(item);
  });
}
function restart(){current=0;score=0;checked=false;userAnswers=Array(questions.length).fill(null);$('results').classList.remove('show');$('quizArea').classList.remove('hidden');renderQuestion();}
$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);$('restartBtn').addEventListener('click',restart);$('restartBtn2').addEventListener('click',restart);renderQuestion();
</script></body></html>
