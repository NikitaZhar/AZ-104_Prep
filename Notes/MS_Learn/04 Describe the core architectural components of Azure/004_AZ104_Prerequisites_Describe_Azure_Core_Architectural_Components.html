<script>
const questions = [{"section": "Azure Overview", "question": "A stakeholder claims Azure is only useful as a place to run virtual machines. Which statement best reflects how the material describes Azure's scope?", "options": ["It is an expanding set of cloud services that runs existing VM workloads and also adds managed databases, autoscaling apps, AI, and IoT.", "It is a hosting product limited to virtual machines, exposing only global billing features wrapped tightly around those running machines.", "It is primarily an identity directory service, so all compute and storage workloads must remain in an on-premises datacenter.", "It is a sovereign government-only cloud platform built mainly for regulated agencies and the partners they have approved."], "answer": 0, "explanation": "The material frames Azure as a continually expanding set of cloud services: VMs are a starting point, but it also offers managed databases, autoscaling web apps, event-driven services, AI, IoT, and scalable storage."}, {"section": "Azure Overview", "question": "An internal app has seasonal demand spikes and the business wants to avoid paying for idle capacity year-round. Which approach matches the practical example in the material?", "options": ["Host on VMs or managed app services, use managed databases, monitor centrally, then scale out for spikes and back afterward.", "Run on permanently fixed-size VMs throughout the entire year and turn off all health monitoring to cut overhead.", "Place every workload inside a single management group, expecting the group itself to scale the compute on its own.", "Deploy the whole application only to an isolated sovereign region, assuming such regions automatically reduce the running cost."], "answer": 0, "explanation": "The example hosts the workload on VMs or managed app services with managed databases, monitors health centrally, and scales resources up or out during spikes and back down when demand drops."}, {"section": "Accounts and Subscriptions", "question": "A new team wants to explore Azure before paying for production usage. How does the material distinguish a free account from paid usage?", "options": ["A free account explores Azure with credits and free services; usage past those limits needs a paid subscription.", "A free account silently turns into a fully paid subscription the very moment the first resource is deployed.", "A free account needs no subscription at all, because resources are created and billed directly under the account.", "A free account is reserved strictly for government workloads and stays permanently isolated from the public Azure instance."], "answer": 0, "explanation": "New users can start with a free account, then upgrade or create a paid subscription when they need services beyond the free limits."}, {"section": "Accounts and Subscriptions", "question": "Which design correctly reflects how accounts, subscriptions, and resources relate in the material?", "options": ["An account links to one or more subscriptions, and resources are created inside those subscriptions.", "Subscriptions are created inside individual resources, and the parent account becomes optional after deployment.", "Resources are created directly inside the Azure account itself, with no subscription involved at any point.", "Availability zones hold the subscriptions, and those subscriptions in turn hold the parent accounts."], "answer": 0, "explanation": "Using Azure requires a subscription; a subscription links to an account, and resources are created within subscriptions."}, {"section": "Accounts and Subscriptions", "question": "A student needs Azure credit, free developer tools, and sign-up without a credit card. Which option fits, and what habit still matters?", "options": ["The Azure free student account, while still monitoring usage and removing resources no longer in use.", "A standard paid subscription, where ongoing usage monitoring is unnecessary because the bundled student tools never cost anything.", "The Tenant Root Group, simply deleting that root group whenever the monthly costs begin to rise.", "A region pair, relying on its secondary region to avoid essentially all of the service charges."], "answer": 0, "explanation": "The free student account gives credit and developer tools without a credit card; the material still advises monitoring usage and removing unneeded resources to avoid surprise costs."}, {"section": "Regions and Global Services", "question": "A team assumes it will pick specific datacenters and racks when deploying resources. Which correction matches the material?", "options": ["Customers choose regions and, where supported, availability zones; datacenters group into those for resiliency.", "Customers must manually select an individual datacenter and a specific server rack for every single resource.", "Azure has no physical datacenters at all, because every service in it is purely logical and virtual.", "Customers only select management groups, after which the billing system quietly assigns the deployment region."], "answer": 0, "explanation": "Azure has datacenters worldwide, but customers interact with regions and availability zones rather than choosing individual datacenters."}, {"section": "Regions and Global Services", "question": "An architect must place a regional workload near users and confirm a required VM size exists there. Which concept is central to that decision?", "options": ["The region, because resources deploy into a geographical area and some VM sizes exist only in certain ones.", "The management group, because it directly picks the physical datacenter rack used for each deployed VM.", "The resource group, because it supposedly guarantees that every VM size is available in every location.", "The Tenant Root Group, because it is what sets the network latency between users and the datacenters."], "answer": 0, "explanation": "A region is a geographical area of one or more nearby datacenters; the material notes some services, VM sizes, and storage types are only available in certain regions."}, {"section": "Regions and Global Services", "question": "Select the services the material lists as global Azure services that do not require choosing a particular region. (Choose Three)", "options": ["Microsoft Entra ID", "Azure Traffic Manager", "Azure DNS", "Azure Virtual Machines", "Azure SQL Database"], "answer": [0, 1, 2], "selectCount": 3, "explanation": "The Note lists Microsoft Entra ID, Azure Traffic Manager, and Azure DNS as global services that don't require region selection. VMs and SQL Database are regional resources."}, {"section": "Regions and Global Services", "question": "Which ordering represents Azure's physical infrastructure from broadest geographical grouping toward the physical facility?", "options": ["Geography, then Region, then Availability Zone, then Datacenter.", "Management Group, then Subscription, then Resource Group, then Resource.", "Account, then Subscription, then Invoice, then Resource Group.", "Tenant Root Group, then Availability Zone, then Region Pair, then Rack."], "answer": 0, "explanation": "The physical infrastructure groups datacenters into availability zones and regions, with regions located within geographies."}, {"section": "Availability Zones", "question": "A workload must survive the loss of one datacenter in a region but does not need to survive a full regional outage. Which component fits best?", "options": ["Availability zones within the selected region.", "Region pairs spanning a geography only.", "A separate subscription for each VM.", "A management group placed above the subscription."], "answer": 0, "explanation": "Availability zones are physically separate datacenters within a region, built as isolation boundaries, so they handle datacenter-level failure inside a region."}, {"section": "Availability Zones", "question": "Which statements about availability zones in a zone-enabled region match the material? (Choose Two)", "options": ["A zone-enabled region has a minimum of three separate availability zones.", "Not every Azure region currently supports availability zones.", "Every Azure region always provides exactly three zones.", "Cross-zone data transfer is always free of charge.", "Availability zones exist only inside sovereign regions."], "answer": [0, 1], "selectCount": 2, "explanation": "The Important note states zone-enabled regions have at least three zones, but not all regions support zones. The material also warns that duplicating services and transferring data between zones can add cost."}, {"section": "Availability Zones", "question": "Match each availability-zone service category to a correct example from the material. (Choose Three)", "options": ["Zonal — a VM, managed disk, or IP address pinned to one zone.", "Zone-redundant — zone-redundant storage or SQL Database that the platform replicates automatically across zones.", "Non-regional — a service available from Azure geographies and resilient to zone and region outages.", "Zonal — a service the platform automatically spreads across every zone.", "Zone-redundant — a resource the customer manually pins to a single zone."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Zonal services are pinned to a zone (VMs, managed disks, IPs); zone-redundant services replicate automatically (zone-redundant storage, SQL Database); non-regional services are always available from geographies and resilient to zone- and region-wide outages."}, {"section": "Availability Zones", "question": "A database service replicates automatically across several zones in a zone-enabled region. Which category describes it?", "options": ["Zone-redundant service.", "Zonal service.", "Non-regional service.", "Sovereign service."], "answer": 0, "explanation": "Zone-redundant services are replicated automatically across zones; the material gives zone-redundant storage and SQL Database as examples."}, {"section": "Availability Zones", "question": "A team pins a VM, a managed disk, and an IP address to one zone. What is the architectural implication?", "options": ["They are zonal resources, so cross-zone resilience needs deliberate replication or distribution.", "They become non-regional services with no further design needed.", "They are protected from full regional outages by default.", "They turn into management-group resources and inherit no subscription settings."], "answer": 0, "explanation": "Zonal resources sit in a specific zone; surviving a zone failure requires distributing or replicating them across zones."}, {"section": "Region Pairs", "question": "A continuity plan must handle a disaster that affects an entire region, not just one zone. Which concept should be evaluated next?", "options": ["Region pairs and cross-region recovery design.", "A single zonal VM.", "Resource-group delete protection.", "A second invoice on the same subscription."], "answer": 0, "explanation": "Availability zones help within a region; for an event affecting a whole region, region pairs provide additional resilience planning."}, {"section": "Region Pairs", "question": "Why are paired regions usually placed in the same geography but at least 300 miles apart?", "options": ["To isolate them from one regional disaster while keeping data in-geography for residency and compliance.", "To deliberately keep them close enough together that the two regions can share one physical datacenter.", "To ensure that both paired regions always fail together at the same time during any planned platform updates.", "To finally let resource groups be nested across both of the paired regions in the geography."], "answer": 0, "explanation": "Pairs sit in the same geography and 300+ miles apart, supporting disaster isolation while helping data stay within the geography for residency and compliance."}, {"section": "Region Pairs", "question": "Which advantages of region pairs does the material list? (Choose Three)", "options": ["If a broad outage occurs, one region in each pair is prioritized for faster restoration.", "Planned platform updates roll out to paired regions one region at a time.", "Data generally stays within the same geography as its pair for residency and compliance.", "Every Azure service automatically replicates and fails over with no configuration.", "Paired regions are always within 50 miles to keep latency minimal."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "The advantages are prioritized restoration of one region per pair, staggered (one-at-a-time) updates, and same-geography data residency. The material explicitly warns not all services auto-replicate, and pairs are 300+ miles apart."}, {"section": "Region Pairs", "question": "A team assumes every Azure service automatically replicates to its paired region. What is the correct caution?", "options": ["Region pairs aid resilience, but some services do not auto-replicate or fail over, so customers may configure it.", "Region pairs are guaranteed to provide automatic replication and automatic failover for absolutely every Azure service.", "Only management groups are ever able to replicate any data across the two paired regions.", "Region pairs are a billing-only construct and are completely unrelated to any disaster recovery."], "answer": 0, "explanation": "The material warns that not all Azure services automatically replicate or fail over; recovery and replication may need to be configured by the customer."}, {"section": "Region Pairs", "question": "Using Brazil South as an example, which statement reflects the material's caution about pairing direction?", "options": ["Most pairs are bidirectional, but some such as Brazil South are one-directional, and some have no pair.", "All Azure region pairs are strictly bidirectional in every case, without a single documented exception.", "Brazil South is in fact paired bidirectionally with a dedicated Brazil North region in the same geography.", "Regions that lack a traditional pair are unable to use any resiliency or redundancy features whatsoever."], "answer": 0, "explanation": "Most regions pair in both directions, but Brazil South is one-directional (secondary is South Central US), and regions like Italy North, Poland Central, and Israel Central rely on zones and geo-redundant storage instead of a traditional pair."}, {"section": "Sovereign Regions", "question": "A regulated organization asks whether a normal public region always satisfies legal isolation needs. Which answer matches the material?", "options": ["Not always; sovereign regions are isolated Azure instances sometimes required for compliance or legal needs.", "Public regions are always sufficient, since sovereign regions are merely a billing label placed on standard regions.", "Public regions are always sufficient, because availability zones already provide every legal isolation automatically.", "Public regions never suffice, because only resource groups are able to deliver any legal isolation here."], "answer": 0, "explanation": "Sovereign regions are instances of Azure isolated from the main instance, used when compliance or legal requirements demand it."}, {"section": "Sovereign Regions", "question": "A US government partner needs regions operated by screened US personnel with extra compliance certifications. Which option fits?", "options": ["US government sovereign regions, for example US DoD Central, US Gov Virginia, or US Gov Arizona.", "Any ordinary commercial Azure region that simply happens to have three availability zones enabled.", "A standard commercial region pair, for instance West US paired together with East US.", "A management group that has been placed directly underneath the tenant's Tenant Root Group."], "answer": 0, "explanation": "US government regions are physically and logically network-isolated Azure instances operated by screened US personnel with additional compliance certifications."}, {"section": "Sovereign Regions", "question": "Why do Azure China regions have a different operational arrangement?", "options": ["They run through a 21Vianet partnership, and Microsoft does not directly maintain those datacenters.", "They are operated directly by the US Department of Defense rather than by Microsoft itself.", "They are ordinary commercial Azure regions that carry no special operational arrangement at all.", "They exist only as a set of availability zones tucked inside other commercial regions."], "answer": 0, "explanation": "China East, China North, and related regions are available through a partnership between Microsoft and 21Vianet, with Microsoft not directly maintaining the datacenters."}, {"section": "Sovereign Regions", "question": "Which pair of characteristics distinguishes the two sovereign-region examples in the material? (Choose Two)", "options": ["US government regions are network-isolated instances operated by screened US personnel.", "China regions are delivered via a 21Vianet partnership where Microsoft does not directly run the datacenters.", "Both example sets are maintained directly by Microsoft with no partners involved.", "Both example sets are ordinary commercial regions with standard operations.", "US government regions are operated by 21Vianet on Microsoft's behalf."], "answer": [0, 1], "selectCount": 2, "explanation": "US government regions are isolated instances run by screened US personnel with extra certifications; China regions operate through the 21Vianet partnership, with Microsoft not directly maintaining them."}, {"section": "Resources and Resource Groups", "question": "A temporary test environment uses VMs, virtual networks, databases, and Azure AI services, and the team wants to remove it all at once when finished. Which construct should group them?", "options": ["A resource group holding the related resources.", "A region pair holding the related resources.", "The Tenant Root Group holding the resources directly.", "An availability zone used as the lifecycle container."], "answer": 0, "explanation": "Resources can be placed in a resource group; deleting the group deletes everything inside it, which suits temporary environments."}, {"section": "Resources and Resource Groups", "question": "Which rules about resource groups does the material state? (Choose Three)", "options": ["A resource must belong to exactly one resource group at a time.", "Resource groups cannot be nested inside other resource groups.", "A resource group cannot be renamed after it is created.", "A resource group can contain only a single resource.", "Deleting a resource group keeps its resources but clears their tags."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Each resource lives in exactly one group, groups can't be nested, and they can't be renamed after creation. Groups hold many resources, and deleting a group deletes everything in it."}, {"section": "Resources and Resource Groups", "question": "An administrator denies access at the resource-group level. What result should be expected?", "options": ["The access setting applies to all resources inside that resource group.", "It applies only to resources created later, not existing ones.", "It applies only to subscriptions above the group.", "Group-level access has no effect on contained resources."], "answer": 0, "explanation": "Actions on a resource group affect the resources inside it; granting or denying access at the group level applies to all its resources."}, {"section": "Resources and Resource Groups", "question": "Two project teams share one subscription but must not see or manage each other's resources, without splitting into separate subscriptions. Which approach matches the material?", "options": ["Give each project its own resource group so each team manages only its own resources.", "Put everything in one group and rely on resource names alone.", "Assign one availability zone per team as an access scope.", "Use a region pair, since paired regions separate team permissions."], "answer": 0, "explanation": "The material gives multiple projects as a case for separate resource groups, so each team sees and manages only its own resources."}, {"section": "Subscriptions", "question": "A company needs separate invoices and billing reports for development and production under one account. Which boundary fits the billing requirement?", "options": ["Separate subscriptions, since subscriptions are billing boundaries.", "Separate resource groups, since each group issues its own invoice.", "Separate availability zones, since zones drive billing reports.", "Separate resources in one group, since each resource is invoiced on its own."], "answer": 0, "explanation": "Subscriptions act as billing boundaries; Azure generates separate billing reports and invoices for each subscription."}, {"section": "Subscriptions", "question": "Which two boundary types does the material describe for Azure subscriptions? (Choose Two)", "options": ["A billing boundary that determines how the account is billed.", "An access-control boundary where access-management policies are applied.", "A latency boundary that sets the network distance between zones.", "A residency boundary that forces all data into one datacenter.", "A naming boundary that locks resource-group names."], "answer": [0, 1], "selectCount": 2, "explanation": "The material defines two subscription boundaries: a billing boundary (how the account is billed, with separate invoices) and an access-control boundary (access-management policies applied at subscription level)."}, {"section": "Subscriptions", "question": "Which statement correctly compares resource groups and subscriptions in the management hierarchy?", "options": ["Subscriptions contain resource groups, and resource groups contain resources.", "Resource groups contain subscriptions, and subscriptions contain management groups.", "Resources contain subscriptions directly.", "Availability zones contain subscriptions, which contain resource groups."], "answer": 0, "explanation": "Resources go into resource groups, and resource groups go into subscriptions."}, {"section": "Subscriptions", "question": "An architect argues resource groups alone can fully separate billing and subscription-level access policies. What is the flaw?", "options": ["Resource groups organize resources, but subscriptions are the management, billing, and scale units setting those boundaries.", "Resource groups are strictly limited and cannot ever hold more than one single resource at a time.", "Subscriptions are really physical datacenters and therefore cannot affect access control in any way.", "Billing in Azure is ultimately controlled only by the choice of availability zones."], "answer": 0, "explanation": "Resource groups organize resources, while subscriptions are units of management, billing, and scale that provide billing and access-control boundaries."}, {"section": "Subscriptions", "question": "Which reasons does the material give for creating additional subscriptions? (Choose Three)", "options": ["Separating environments such as sandbox, development, test, and production.", "Separating teams or workloads so each project's costs are easy to track.", "Separating billing to track costs for different requirements independently.", "Forcing all resources into a single shared availability zone.", "Renaming resource groups after they are created."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "The material lists environments, team/workload boundaries, and billing as reasons to create additional subscriptions."}, {"section": "Management Groups", "question": "An enterprise has dozens of subscriptions and wants to apply a compliance rule above the subscription level. Which construct fits?", "options": ["Management groups.", "Availability zones.", "Resource-group naming conventions only.", "Region pairs."], "answer": 0, "explanation": "Management groups sit above subscriptions and let governance conditions such as access policies and compliance rules apply across subscriptions."}, {"section": "Management Groups", "question": "A policy is applied to a management group containing several subscriptions. What happens to those subscriptions?", "options": ["They automatically inherit the governance conditions from the management group.", "They are converted into resource groups.", "They stop acting as billing boundaries.", "They must each recreate the policy manually with no inheritance."], "answer": 0, "explanation": "Subscriptions under a management group automatically inherit the governance conditions applied to that group."}, {"section": "Management Groups", "question": "Which facts about management groups does the material state? (Choose Three)", "options": ["They can be nested up to six levels deep, excluding the root and subscription levels.", "A single directory supports up to 10,000 management groups.", "Each management group and subscription can have only one parent.", "A directory supports at most six management groups in total.", "Management groups are not able to contain any subscriptions underneath them."], "answer": [0, 1, 2], "selectCount": 3, "explanation": "Management groups nest up to six levels deep (excluding root and subscription levels), a directory supports up to 10,000 of them, and each group or subscription has exactly one parent."}, {"section": "Management Groups", "question": "A company must limit VM locations to West US across all production subscriptions, and owners must not be able to override it. Where should the policy go?", "options": ["On the Production management group that contains those subscriptions.", "Individually inside each VM after deployment.", "On an availability zone inside one region.", "On the Azure free account level."], "answer": 0, "explanation": "The material's example applies a VM-location policy at a Production management group; it inherits to subscriptions and VMs, and owners cannot override it."}, {"section": "Management Groups", "question": "Which statement correctly describes the Tenant Root Group?", "options": ["Every Microsoft Entra tenant has one top-level Tenant Root Group that all groups and subscriptions fold up to.", "Each individual subscription in the tenant creates and owns its own separate Tenant Root Group.", "Tenant Root Groups are special objects that exist only inside isolated sovereign Azure regions.", "The Tenant Root Group is essentially the same kind of object as an ordinary resource group."], "answer": 0, "explanation": "Each Microsoft Entra tenant has a single top-level Tenant Root Group above all management groups and subscriptions in that tenant."}, {"section": "Management Groups", "question": "A central IT team wants one access assignment to cover many subscriptions instead of scripting roles per subscription. Which design fits?", "options": ["Place the subscriptions under a management group and assign Azure RBAC at that group's scope.", "Assign the access roles only at each individual VM scope, specifically to avoid any inheritance.", "Use a completely separate region pair dedicated to each of the requesting teams.", "Use a zonal service instead, on the assumption that zones inherit RBAC down to subscriptions."], "answer": 0, "explanation": "Assigning Azure RBAC at a management group lets sub-management groups, subscriptions, resource groups, and resources inherit those permissions."}, {"section": "Hierarchy and Inheritance", "question": "A policy is applied at a management group; under it sits a subscription with a resource group of VMs. Which inheritance path is correct?", "options": ["Management Group, then Subscription, then Resource Group, then Resource.", "Resource, then Resource Group, then Subscription, then Management Group.", "Region, then Availability Zone, then Subscription, then Resource Group.", "Account, then Datacenter, then Rack, then VM."], "answer": 0, "explanation": "The governance hierarchy is management group, subscription, resource group, resource, with policies and RBAC inheriting downward."}, {"section": "Hierarchy and Inheritance", "question": "A subscription owner claims they can override a VM-location restriction inherited from the Production management group. Which answer is correct?", "options": ["They can never override it once it is enforced from the management-group scope.", "They can always override inherited policies at the subscription level.", "The policy applies only to billing reports, not VMs.", "The policy stops at the subscription and never reaches resources."], "answer": 0, "explanation": "The material states a policy applied at a Production management group inherits to subscriptions and VMs, and the resource or subscription owner cannot override it."}, {"section": "Hierarchy and Inheritance", "question": "One team needs a single access assignment across many subscriptions; another only needs access to one temporary project environment. Which scopes fit?", "options": ["Management-group scope for broad access; resource-group scope for the temporary project.", "Availability-zone scope applied identically for both of the two access needs.", "Region-pair scope for the broad access and the Tenant Root Group scope for the small project.", "Individual-datacenter scope for the broad access and a single isolated VM for the project."], "answer": 0, "explanation": "Management groups suit access across many subscriptions; resource groups suit managing a set of related resources such as a temporary project."}, {"section": "Hierarchy and Inheritance", "question": "A company wants separate billing for Dev and Prod plus a shared security baseline across both. Which combined design fits the material?", "options": ["Separate Dev and Prod subscriptions for billing and access, under one common management group for shared policy.", "One single shared resource group for both Dev and Prod, on the idea that groups issue their own separate invoices.", "One availability zone assigned to Dev and a second one to Prod, expecting that to provide policy inheritance.", "Two sover let current=0, score=0, checked=false, userAnswers=Array(questions.length).fill(null);
let shuffledOptions = [];
let correctSet = [];
const $=id=>document.getElementById(id);

function isMulti(q){return Array.isArray(q.answer);}

function shuffleArray(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function updateLiveScore(){
  const percent = current === 0 && score === 0 ? 0 : Math.round((score / questions.length) * 100);
  $('scoreLive').textContent = `Score: ${score} / ${questions.length} (${percent}%)`;
}

function renderQuestion(){
  const q=questions[current];
  checked=false;
  const answerArr = isMulti(q) ? q.answer : [q.answer];
  shuffledOptions = shuffleArray(q.options.map((text, originalIndex)=>({text, originalIndex})));
  correctSet = shuffledOptions.map((o,idx)=>answerArr.includes(o.originalIndex)?idx:-1).filter(x=>x>=0);

  $('counter').textContent=`Question ${current+1} of ${questions.length}`;
  updateLiveScore();
  $('progressFill').style.width=`${(current/questions.length)*100}%`;
  $('section').textContent=q.section;
  $('question').innerHTML=q.question;
  $('hint').textContent = isMulti(q) ? `Select ${q.selectCount}.` : '';
  $('feedback').classList.remove('show');
  $('status').textContent='';
  $('explanation').textContent='';
  $('nextBtn').disabled=true;
  $('checkBtn').disabled=false;
  $('options').innerHTML='';

  const inputType = isMulti(q) ? 'checkbox' : 'radio';
  shuffledOptions.forEach((option,index)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML=`<input type="${inputType}" name="answer" value="${index}"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${option.text}</span>`;
    $('options').appendChild(label);
  });

}

function enforceLimit(){
  const q=questions[current];
  if(!isMulti(q))return;
  const boxes=[...document.querySelectorAll('input[name="answer"]')];
  const checkedCount=boxes.filter(b=>b.checked).length;
  boxes.forEach(b=>{ b.disabled = (!b.checked && checkedCount>=q.selectCount); });
}

function selectedIndices(){
  return [...document.querySelectorAll('input[name="answer"]:checked')].map(b=>Number(b.value));
}

function checkAnswer(){
  if(checked)return;
  const q=questions[current];
  const sel=selectedIndices();
  const need = isMulti(q) ? q.selectCount : 1;
  if(sel.length!==need){
    $('feedback').classList.add('show');
    $('status').textContent = isMulti(q) ? `Please select ${q.selectCount} option(s).` : 'Please select an answer.';
    $('status').className='status';
    $('explanation').textContent='';
    return;
  }
  checked=true;
  const correctSorted=[...correctSet].sort((a,b)=>a-b).join(',');
  const selSorted=[...sel].sort((a,b)=>a-b).join(',');
  const ok = correctSorted===selSorted;
  if(ok)score++;

  userAnswers[current]={
    selectedText: sel.map(i=>shuffledOptions[i].text).join(' | '),
    correctText: correctSet.map(i=>shuffledOptions[i].text).join(' | '),
    ok: ok
  };

  document.querySelectorAll('.option').forEach((el,index)=>{
    el.querySelector('input').disabled=true;
    if(correctSet.includes(index))el.classList.add('correct');
    if(sel.includes(index)&&!correctSet.includes(index))el.classList.add('wrong');
  });

  $('feedback').classList.add('show');
  $('status').textContent=ok?'Correct':'Incorrect';
  $('status').className='status '+(ok?'ok':'bad');
  $('explanation').textContent=q.explanation;
  updateLiveScore();
  $('nextBtn').disabled=false;
  $('checkBtn').disabled=true;
}

function nextQuestion(){if(current<questions.length-1){current++;renderQuestion();}else showResults();}

function showResults(){
  $('progressFill').style.width='100%';
  $('quizArea').classList.add('hidden');
  $('results').classList.add('show');

  const percent=Math.round(score/questions.length*100);
  $('finalScore').textContent=`${score} / ${questions.length} (${percent}%)`;
  $('finalText').textContent=percent>=85
    ?'Excellent result. You have a strong grasp of the core architectural components of Azure.'
    :percent>=70
      ?'Good result, but review your mistakes — especially the differences between Region, Availability Zone, Region Pair, Subscription, Resource Group, and Management Group.'
      :'Revisit the section "Describe the core architectural components of Azure" and retake the quiz.';

  $('review').innerHTML='';
  questions.forEach((q,i)=>{
    const ua=userAnswers[i];
    const ok=ua!==null && ua.ok;
    const correctText = isMulti(q) ? q.answer.map(a=>q.options[a]).join(' | ') : q.options[q.answer];
    const item=document.createElement('div');
    item.className='review-item';
    item.innerHTML=`<strong>${i+1}. ${q.section}</strong><br>${q.question}<br><span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ua===null?'Not answered':(ok?'Correct':'Incorrect')}</span><br>Your answer: ${ua===null?'No answer':ua.selectedText}<br>Correct answer: ${ua===null?correctText:ua.correctText}<br><em>${q.explanation}</em>`;
    $('review').appendChild(item);
  });
}

function hashStr(s){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){
    const ch=s.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function todayStrLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
async function ensureRWPermission(handle){
  const opts={mode:'readwrite'};
  if((await handle.queryPermission(opts))==='granted') return true;
  if((await handle.requestPermission(opts))==='granted') return true;
  return false;
}
function downloadFallbackExport(quizTitle, missed){
  const payload={quizTitle, date:todayStrLocal(), mistakes:missed};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safe=quizTitle.replace(/[^\w\-]+/g,'_').slice(0,60);
  a.href=url; a.download='mistakes_'+safe+'_'+todayStrLocal()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function exportMistakesToJournal(forceCreate){
  const quizTitle = document.title || 'AZ-104 Quiz';
  const missed = [];
  questions.forEach((q,i)=>{
    const ua = userAnswers[i];
    if(!ua || !ua.ok){
      missed.push({section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount||null, explanation:q.explanation});
    }
  });
  if(missed.length===0){ alert('Ошибок нет — нечего экспортировать.'); return; }
  if(!('showOpenFilePicker' in window)){
    alert('Браузер не поддерживает прямую запись в файл (нужен Chrome/Edge). Скачиваю отдельный файл — импортируйте его вручную в Журнал ошибок.');
    downloadFallbackExport(quizTitle, missed);
    return;
  }
  let handle;
  try{
    if(forceCreate){
      handle = await window.showSaveFilePicker({suggestedName:'az104-mistakes-journal.json', types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    } else {
      [handle] = await window.showOpenFilePicker({types:[{description:'Журнал ошибок JSON', accept:{'application/json':['.json']}}]});
    }
  }catch(e){ if(e.name!=='AbortError') console.error(e); return; }

  let journal;
  try{
    const perm = await ensureRWPermission(handle);
    if(!perm){ alert('Нет разрешения на запись в файл.'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    journal = text.trim() ? JSON.parse(text) : {mistakes:[]};
    if(!journal.mistakes || !Array.isArray(journal.mistakes)) journal.mistakes=[];
  }catch(e){ alert('Не удалось прочитать файл журнала: '+e.message); return; }

  let added=0, reset=0;
  missed.forEach(q=>{
    const id = hashStr(quizTitle+'|'+q.section+'|'+q.question);
    const existing = journal.mistakes.find(m=>m.id===id);
    if(existing){ existing.box=1; existing.masteredStreak=0; existing.nextReview=todayStrLocal(); reset++; }
    else{
      journal.mistakes.push({id, quizTitle, domain:null, section:q.section, question:q.question, options:q.options, answer:q.answer, selectCount:q.selectCount, explanation:q.explanation, box:1, masteredStreak:0, nextReview:todayStrLocal(), firstMissed:todayStrLocal()});
      added++;
    }
  });
  try{
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(journal,null,2));
    await writable.close();
  }catch(e){ alert('Не удалось сохранить журнал: '+e.message); return; }
  alert(`Готово. Новых вопросов: ${added}, повторно ошиблись: ${reset}.`);
}

function restart(){current=0;score=0;checked=false;userAnswers=Array(questions.length).fill(null);$('results').classList.remove('show');$('quizArea').classList.remove('hidden');renderQuestion();}
$('options').addEventListener('change',enforceLimit);$('checkBtn').addEventListener('click',checkAnswer);$('nextBtn').addEventListener('click',nextQuestion);$('restartBtn').addEventListener('click',restart);$('restartBtn2').addEventListener('click',restart);$('exportMistakesBtn').addEventListener('click',()=>exportMistakesToJournal(false));$('createJournalBtn').addEventListener('click',()=>exportMistakesToJournal(true));renderQuestion();
</script></body></html>
